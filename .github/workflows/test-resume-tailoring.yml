name: Test Resume Tailoring

on:
  workflow_dispatch:

jobs:
  tailor-one-resume:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f resume/master_resume.tex
          test -f jobs/detailed.json
          test -f jobs/ranked.json

          echo "Required files found."

      - name: Generate tailored resume content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          if not os.environ.get("OPENAI_API_KEY"):
              raise RuntimeError(
                  "OPENAI_API_KEY GitHub secret is not configured."
              )

          ranked = json.loads(
              Path("jobs/ranked.json").read_text()
          )

          detailed = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          detailed_by_id = {
              str(job.get("id")): job
              for job in detailed.get("results", [])
          }

          # Pick only the #1 ranked job for this test.
          if not ranked:
              raise RuntimeError("ranked.json contains no ranked jobs.")

          top_job = ranked[0]
          job_id = str(top_job.get("job_id"))

          job = detailed_by_id.get(job_id)

          if not job:
              raise RuntimeError(
                  f"Could not find job {job_id} in detailed.json."
              )

          master_resume = Path(
              "resume/master_resume.tex"
          ).read_text()

          job_description = job.get("description", "")

          if not job_description.strip():
              raise RuntimeError(
                  f"Job {job_id} has no description."
              )

          prompt = f"""
          You are a resume tailoring engine.

          Your task is to analyze ONE job against the candidate's master
          resume and produce a tailoring plan.

          STRICT FACTUAL RULES:
          1. Never invent experience, projects, technologies,
             responsibilities, achievements, metrics, employers, or dates.
          2. Only use information explicitly present in the master resume.
          3. You may recommend reordering existing resume content.
          4. You may recommend rewriting existing bullets for clarity and
             relevance, but the factual meaning must remain unchanged.
          5. Do not add a technology merely because it appears in the job
             description.
          6. If the job asks for something absent from the resume, mark it
             as missing. Do not claim it.
          7. Do not change the candidate's actual years of experience.
          8. Do not create fake metrics or achievements.
          9. Keep the final resume ATS-friendly.

          Return ONLY valid JSON with exactly these fields:

          {{
            "job": {{
              "id": "...",
              "title": "...",
              "company": "...",
              "location": "..."
            }},
            "required_skills": [],
            "matched_skills": [],
            "missing_skills": [],
            "relevant_experience_bullets": [],
            "relevant_projects": [],
            "recommended_skill_order": [],
            "tailoring_notes": []
          }}

          MASTER RESUME:
          {master_resume}

          JOB DESCRIPTION:
          {job_description}
          """

          payload = {
              "model": "gpt-5.6-luna",
              "input": [
                  {
                      "role": "system",
                      "content": (
                          "You are a precise resume tailoring engine. "
                          "Follow the factual rules exactly."
                      )
                  },
                  {
                      "role": "user",
                      "content": prompt
                  }
              ]
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": (
                      "Bearer "
                      + os.environ["OPENAI_API_KEY"]
                  ),
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              api_response = json.loads(
                  response.read().decode("utf-8")
              )

          output_text = api_response.get("output_text")

          if not output_text:
              raise RuntimeError(
                  "OpenAI response did not contain output_text."
              )

          # The model was instructed to return JSON.
          tailoring = json.loads(output_text)

          Path("jobs/test-tailoring.json").write_text(
              json.dumps(
                  tailoring,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          print(
              json.dumps(
                  tailoring,
                  indent=2,
                  ensure_ascii=False,
              )
          )
          PY

      - name: Upload tailoring result
        uses: actions/upload-artifact@v4
        with:
          name: test-resume-tailoring
          path: jobs/test-tailoring.json
          retention-days: 7
