name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search jobs across locations and queries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          cli = ".agents/skills/linkedin-search/cli/src/cli.ts"

          queries = [
              "Java Backend Developer",
              "Java Developer Spring Boot",
              "Java Microservices",
              "Spring Boot Backend",
              "Java Software Engineer",
          ]

          locations = [
              ("pune", "Pune, Maharashtra, India"),
              ("gurugram", "Gurugram, Haryana, India"),
              ("noida", "Noida, Uttar Pradesh, India"),
              ("bengaluru", "Bengaluru, Karnataka, India"),
              ("hyderabad", "Hyderabad, Telangana, India"),
              ("remote", "Remote India"),
          ]

          total = 0

          for location_key, location in locations:
              for query_index, query in enumerate(queries, 1):
                  output_file = Path(
                      f"jobs/search-{location_key}-{query_index}.json"
                  )

                  print(f"Searching: {query} | {location}")

                  try:
                      result = subprocess.run(
                          [
                              "bun",
                              "run",
                              cli,
                              "search",
                              "--query",
                              query,
                              "--location",
                              location,
                              "--jobage",
                              "1",
                              "--limit",
                              "8",
                              "--format",
                              "json",
                          ],
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )

                      if result.returncode == 0:
                          output_file.write_text(result.stdout)
                          total += 1
                      else:
                          print(
                              f"Search failed for {query} | {location}: "
                              f"{result.stderr[:500]}"
                          )

                  except Exception as exc:
                      print(
                          f"Search error for {query} | {location}: {exc}"
                      )

          print(f"Successful searches: {total}/30")
          PY

      - name: Combine and deduplicate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("search-*.json"):
              try:
                  data = json.loads(file.read_text())
              except Exception as exc:
                  print(f"Skipping invalid {file}: {exc}")
                  continue

              for job in data.get("results", []):
                  job_id = job.get("id")

                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs,
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Fetch job details
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          cli = ".agents/skills/linkedin-search/cli/src/cli.ts"

          data = json.loads(
              Path("jobs/all.json").read_text()
          )

          detailed = []
          results = data.get("results", [])

          for i, job in enumerate(results, 1):
              job_id = job["id"]

              print(
                  f"[{i}/{len(results)}] "
                  f"Fetching {job_id} - {job.get('title', '')}"
              )

              try:
                  result = subprocess.run(
                      [
                          "bun",
                          "run",
                          cli,
                          "detail",
                          job_id,
                          "--format",
                          "json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  if result.returncode == 0:
                      detail = json.loads(result.stdout)

                      if isinstance(detail, dict):
                          job.update(detail)

                  else:
                      print(
                          f"Detail fetch failed for {job_id}: "
                          f"{result.stderr[:300]}"
                      )

                  detailed.append(job)

              except Exception as exc:
                  print(
                      f"Error fetching {job_id}: {exc}"
                  )
                  detailed.append(job)

              time.sleep(1)

          Path("jobs/detailed.json").write_text(
              json.dumps(
                  {
                      "count": len(detailed),
                      "results": detailed,
                  },
                  indent=2,
              )
          )

          print(
              f"Detailed jobs collected: {len(detailed)}"
          )
          PY

      - name: Create ranked report
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          profile = json.loads(
              Path("config/job-profile.json").read_text()
          )

          data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          target_roles = profile.get(
              "target_roles",
              {}
          )

          primary_roles = [
              x.lower()
              for x in target_roles.get("primary", [])
          ]

          secondary_roles = [
              x.lower()
              for x in target_roles.get("secondary", [])
          ]

          experience = profile.get(
              "experience",
              {}
          )

          current_years = float(
              experience.get("current_years", 0)
          )

          minimum_years = float(
              experience.get("minimum_years", 0)
          )

          ideal_minimum_years = float(
              experience.get("ideal_minimum_years", 0)
          )

          ideal_maximum_years = float(
              experience.get("ideal_maximum_years", 0)
          )

          maximum_years = float(
              experience.get("maximum_years", 0)
          )

          skills = profile.get(
              "skills",
              {}
          )

          must_have = [
              x.lower()
              for x in skills.get("must_have", [])
          ]

          high_value = [
              x.lower()
              for x in skills.get("high_value", [])
          ]

          supporting = [
              x.lower()
              for x in skills.get("supporting", [])
          ]

          bonus = [
              x.lower()
              for x in skills.get("bonus", [])
          ]

          locations = {
              k.lower(): float(v)
              for k, v in profile.get(
                  "locations",
                  {}
              ).items()
          }

          avoid = [
              x.lower()
              for x in profile.get("avoid", [])
          ]

          daily_target = int(
              profile.get("daily_target", 50)
          )

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "").lower()
              ).strip()

          def job_text(job):
              return " ".join(
                  [
                      str(job.get("title", "")),
                      str(job.get("description", "")),
                      str(job.get("requirements", "")),
                      str(job.get("experience", "")),
                  ]
              )

          def extract_experience_range(text):
              patterns = [
                  (
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:-|–|—|to)\s*"
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:\+)?\s*(?:years?|yrs?)"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*\+\s*"
                      r"(?:years?|yrs?)"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:years?|yrs?)"
                  ),
              ]

              ranges = []

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  ):
                      if match.lastindex == 2:
                          low = float(match.group(1))
                          high = float(match.group(2))

                          ranges.append(
                              (low, high, False)
                          )
                      else:
                          low = float(match.group(1))

                          if "+" in match.group(0):
                              ranges.append(
                                  (low, float("inf"), True)
                              )
                          else:
                              ranges.append(
                                  (low, low, False)
                              )

              if not ranges:
                  return None

              return ranges

          def experience_score(text):
              ranges = extract_experience_range(text)

              if not ranges:
                  return 0, None

              best_score = 0
              best_range = None

              for low, high, open_ended in ranges:
                  if (
                      high < minimum_years
                      or low > maximum_years
                  ):
                      continue

                  if (
                      low <= ideal_minimum_years
                      and (
                          open_ended
                          or high >= ideal_maximum_years
                      )
                  ):
                      score = 20
                  elif (
                      low <= current_years
                      and (
                          open_ended
                          or high >= current_years
                      )
                  ):
                      score = 16
                  elif (
                      low <= ideal_maximum_years
                      and (
                          open_ended
                          or high >= ideal_minimum_years
                      )
                  ):
                      score = 12
                  else:
                      score = 8

                  if score > best_score:
                      best_score = score
                      best_range = (low, high)

              return best_score, best_range

          def role_score(title):
              normalized = normalize(title)

              if normalized in primary_roles:
                  return 30, "Primary role match"

              if any(
                  role in normalized
                  for role in primary_roles
              ):
                  return 25, "Strong role match"

              if normalized in secondary_roles:
                  return 20, "Secondary role match"

              if any(
                  role in normalized
                  for role in secondary_roles
              ):
                  return 15, "Related role match"

              return 0, "Weak role match"

          def skill_score(text):
              score = 0
              matched = []
              missing = []

              for skill in must_have:
                  if skill in text:
                      score += 20
                      matched.append(skill)
                  else:
                      missing.append(skill)

              for skill in high_value:
                  if skill in text:
                      score += 6
                      matched.append(skill)

              for skill in supporting:
                  if skill in text:
                      score += 3
                      matched.append(skill)

              for skill in bonus:
                  if skill in text:
                      score += 1
                      matched.append(skill)

              return min(score, 30), matched, missing

          def location_score(location):
              normalized = normalize(location)

              best = 0
              best_match = None

              for location_name, score in locations.items():
                  if location_name in normalized:
                      if score > best:
                          best = score
                          best_match = location_name

              return best, best_match

          ranked = []

          for job in data.get("results", []):
              title = job.get("title", "")
              location = job.get("location", "")
              text = normalize(job_text(job))

              role_points, role_reason = role_score(title)
              skill_points, matched, missing = skill_score(text)
              loc_points, loc_match = location_score(location)
              exp_points, exp_range = experience_score(text)

              avoid_matches = [
                  term
                  for term in avoid
                  if term in text
              ]

              avoid_penalty = len(avoid_matches) * 20

              mode_points = 0
              mode_reason = ""

              if "remote" in normalize(location):
                  mode_points = 10
                  mode_reason = "Remote"
              elif "hybrid" in text:
                  mode_points = 8
                  mode_reason = "Hybrid"
              elif "onsite" in text or "on-site" in text:
                  mode_points = 6
                  mode_reason = "Onsite"

              total_score = (
                  role_points
                  + skill_points
                  + loc_points * 0.2
                  + exp_points
                  + mode_points
                  - avoid_penalty
              )

              reasons = [
                  role_reason,
                  f"Skills: {len(matched)} matched",
              ]

              if loc_match:
                  reasons.append(
                      f"Location: {loc_match}"
                  )

              if exp_range:
                  reasons.append(
                      f"Experience: {exp_range[0]}-{exp_range[1]}"
                  )

              if mode_reason:
                  reasons.append(mode_reason)

              if avoid_matches:
                  reasons.append(
                      f"Avoid terms: {', '.join(avoid_matches)}"
                  )

              job_copy = dict(job)

              job_copy["score"] = round(
                  total_score,
                  2
              )

              job_copy["matched_skills"] = sorted(
                  set(matched)
              )

              job_copy["missing_skills"] = sorted(
                  set(missing)
              )

              job_copy["experience_score"] = exp_points
              job_copy["role_score"] = role_points
              job_copy["skill_score"] = skill_points
              job_copy["location_score"] = loc_points
              job_copy["mode_score"] = mode_points
              job_copy["reasons"] = reasons

              ranked.append(job_copy)

          ranked.sort(
              key=lambda job: (
                  job.get("score", 0),
                  job.get("role_score", 0),
                  job.get("skill_score", 0),
                  job.get("experience_score", 0),
              ),
              reverse=True,
          )

          for rank, job in enumerate(
              ranked,
              1
          ):
              job["rank"] = rank

          output = {
              "generated_on": date.today().isoformat(),
              "count": len(ranked),
              "daily_target": daily_target,
              "results": ranked,
          }

          Path("jobs/ranked.json").write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          print(
              f"Ranked jobs: {len(ranked)}"
          )
          PY

      - name: Tailor top 1 job with Google Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          ranked_data = json.loads(
              Path("jobs/ranked.json").read_text()
          )

          detailed_data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          candidate_skills = json.loads(
              Path("config/candidate-skills.json").read_text()
          )

          master_resume = Path(
              "resume/master_resume.tex"
          ).read_text()

          ranked = ranked_data.get(
              "results",
              []
          )

          if not isinstance(ranked, list):
              raise RuntimeError(
                  f"Expected ranked results to be a list, got {type(ranked).__name__}"
              )

          detailed_by_id = {
              str(job.get("id")): job
              for job in detailed_data.get(
                  "results",
                  []
              )
          }

          TARGET_JOBS = 1
          MINIMUM_JOBS = 1

          selected = []
          for job in ranked:
              selected.append(job)
              if len(selected) >= TARGET_JOBS:
                  break

          output_dir = Path(
              "jobs/tailored-resumes"
          )
          output_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          api_key = os.environ.get(
              "GEMINI_API_KEY"
          )

          if not api_key:
              raise RuntimeError(
                  "GEMINI_API_KEY is not configured."
              )

          MODEL = "gemini-3.7-flash"

          results = []
          failures = []

          def make_job_key(job_id):
              raw = str(job_id)
              return re.sub(
                  r"[^A-Za-z0-9_-]",
                  "",
                  raw,
              )[:24]

          def extract_text(api_response):
              candidates = api_response.get(
                  "candidates",
                  []
              )

              if not candidates:
                  print(
                      "----- Gemini response diagnostic -----"
                  )
                  print(
                      f"response_keys: {list(api_response.keys())}"
                  )
                  print(
                      json.dumps(
                          api_response,
                          indent=2,
                          ensure_ascii=False,
                      )[:6000]
                  )
                  print(
                      "----- end Gemini response diagnostic -----"
                  )
                  raise RuntimeError(
                      "Gemini returned no candidates."
                  )

              candidate = candidates[0]
              content = candidate.get(
                  "content",
                  {}
              )

              parts = content.get(
                  "parts",
                  []
              )

              text_parts = [
                  part.get("text", "")
                  for part in parts
                  if isinstance(part, dict)
                  and isinstance(part.get("text"), str)
              ]

              output = "".join(text_parts)

              if output.strip():
                  return output

              print(
                  "----- Gemini response diagnostic -----"
              )
              print(
                  f"model: {api_response.get('modelVersion')}"
              )
              print(
                  f"finish_reason: {candidate.get('finishReason')}"
              )
              print(
                  f"content_parts: {len(parts)}"
              )
              print(
                  f"usage_metadata: {api_response.get('usageMetadata')}"
              )
              print(
                  json.dumps(
                      api_response,
                      indent=2,
                      ensure_ascii=False,
                  )[:6000]
              )
              print(
                  "----- end Gemini response diagnostic -----"
              )

              raise RuntimeError(
                  "Gemini response did not contain text content."
              )

          def call_gemini(prompt):
              payload = {
                  "contents": [
                      {
                          "role": "user",
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "responseMimeType": "application/json",
                      "temperature": 0.2,
                  }
              }

              endpoint = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/gemini-3.7-flash:generateContent"
                  f"?key={api_key}"
              )

              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(
                      payload
                  ).encode("utf-8"),
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST",
              )

              last_error = None

              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(
                          request,
                          timeout=180,
                      ) as response:
                          raw = response.read().decode(
                              "utf-8"
                          )

                      return json.loads(raw)

                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode(
                          "utf-8",
                          errors="replace",
                      )

                      last_error = (
                          f"HTTP {exc.code}: {body[:2000]}"
                      )

                      if exc.code in {
                          429,
                          500,
                          502,
                          503,
                          504,
                      } and attempt < 4:
                          sleep_seconds = (
                              2 ** attempt
                          )

                          print(
                              f"Gemini HTTP {exc.code}; "
                              f"retrying in {sleep_seconds}s..."
                          )

                          time.sleep(
                              sleep_seconds
                          )
                          continue

                      raise RuntimeError(
                          last_error
                      )

                  except (
                      urllib.error.URLError,
                      TimeoutError,
                  ) as exc:
                      last_error = str(exc)

                      if attempt < 4:
                          sleep_seconds = (
                              2 ** attempt
                          )

                          print(
                              "Gemini network error; "
                              f"retrying in {sleep_seconds}s..."
                          )

                          time.sleep(
                              sleep_seconds
                          )
                          continue

                      raise RuntimeError(
                          last_error
                      )

              raise RuntimeError(
                  last_error or
                  "Gemini request failed."
              )

          for index, ranked_job in enumerate(
              selected,
              1
          ):
              job_id = str(
                  ranked_job.get(
                      "job_id",
                      ranked_job.get("id", "")
                  )
              )

              detailed_job = detailed_by_id.get(
                  job_id,
                  ranked_job
              )

              company = ranked_job.get(
                  "company",
                  ""
              )

              title = ranked_job.get(
                  "title",
                  ""
              )

              job_key = make_job_key(
                  job_id
              )

              print(
                  f"[{index}/{len(selected)}] "
                  f"Tailoring {title} | {company} | "
                  f"ID {job_id} | KEY {job_key}"
              )

              prompt = f"""
          You are tailoring a one-page ATS-friendly resume for a Java backend/software engineering candidate.

          IMPORTANT:
          - Use ONLY information supported by the master resume.
          - Do not invent employers, dates, technologies, metrics, responsibilities, certifications, or achievements.
          - Preserve factual truth.
          - Tailor wording and ordering to the job description.
          - Prioritize relevant Java, Spring Boot, backend, microservices, REST API, Redis, SQL, Python/FastAPI/Flask, distributed systems, security, CI/CD, Kafka, and AI/RAG experience only when supported by the master resume.
          - Keep the resume to one page.
          - The generated LaTeX must be complete and compile with pdflatex.
          - Do not use Markdown code fences.
          - Return valid JSON only.
          - The "tex" field must contain the complete LaTeX source as a JSON string.
          - Escape all backslashes, quotes, and newlines according to JSON encoding.
          - Do not use Markdown code fences.

          CANDIDATE SKILLS:
          {json.dumps(candidate_skills, indent=2, ensure_ascii=False)}

          MASTER RESUME:
          {master_resume}

          JOB INFORMATION:
          {json.dumps(
              detailed_job,
              indent=2,
              ensure_ascii=False,
          )}

          RANKING INFORMATION:
          {json.dumps(
              {
                  "rank": ranked_job.get("rank"),
                  "score": ranked_job.get("score"),
                  "matched_skills": ranked_job.get(
                      "matched_skills",
                      []
                  ),
                  "missing_skills": ranked_job.get(
                      "missing_skills",
                      []
                  ),
                  "reasons": ranked_job.get(
                      "reasons",
                      []
                  ),
              },
              indent=2,
              ensure_ascii=False,
          )}

          REQUIRED OUTPUT:
          1. required_skills
          2. matched_skills
          3. missing_skills
          4. most_relevant_experience_bullets
          5. most_relevant_projects
          6. recommended_skill_order
          7. recommended_profile_focus
          8. recommended_bullet_rewrites
          9. tailoring_notes
          10. tex

          The "tex" field must:
          - start with \\documentclass
          - be a complete LaTeX document
          - be one-page focused
          - preserve the candidate's factual information
          - be optimized for the provided job
          - compile successfully with pdflatex
          """

              try:
                  api_response = call_gemini(
                      prompt
                  )

                  output_text = extract_text(
                      api_response
                  )

                  result = json.loads(
                      output_text
                  )

                  tailored_tex = result.get(
                      "tex"
                  )

                  if (
                      not isinstance(
                          tailored_tex,
                          str,
                      )
                      or not tailored_tex.strip().startswith(
                          "\\documentclass"
                      )
                  ):
                      raise RuntimeError(
                          "Gemini returned invalid LaTeX."
                      )

                  tex_path = (
                      output_dir /
                      f"{job_key}.tex"
                  )

                  tailoring_path = (
                      output_dir /
                      f"{job_key}.json"
                  )

                  tex_path.write_text(
                      tailored_tex
                  )

                  tailoring_record = {
                      "job": {
                          "id": job_id,
                          "job_key": job_key,
                          "title": ranked_job.get(
                              "title",
                              ""
                          ),
                          "company": ranked_job.get(
                              "company",
                              ""
                          ),
                          "location": ranked_job.get(
                              "location",
                              ""
                          ),
                          "url": ranked_job.get(
                              "url",
                              ""
                          ),
                      },
                      "rank": index,
                      "score": ranked_job.get(
                          "score",
                          ""
                      ),
                      "required_skills": result.get(
                          "required_skills",
                          []
                      ),
                      "matched_skills": result.get(
                          "matched_skills",
                          []
                      ),
                      "missing_skills": result.get(
                          "missing_skills",
                          []
                      ),
                      "most_relevant_experience_bullets": result.get(
                          "most_relevant_experience_bullets",
                          []
                      ),
                      "most_relevant_projects": result.get(
                          "most_relevant_projects",
                          []
                      ),
                      "recommended_skill_order": result.get(
                          "recommended_skill_order",
                          []
                      ),
                      "recommended_profile_focus": result.get(
                          "recommended_profile_focus",
                          []
                      ),
                      "recommended_bullet_rewrites": result.get(
                          "recommended_bullet_rewrites",
                          []
                      ),
                      "tailoring_notes": result.get(
                          "tailoring_notes",
                          []
                      ),
                  }

                  tailoring_path.write_text(
                      json.dumps(
                          tailoring_record,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )

                  results.append({
                      "rank": index,
                      "job_key": job_key,
                      "job_id": job_id,
                      "title": ranked_job.get(
                          "title",
                          ""
                      ),
                      "company": ranked_job.get(
                          "company",
                          ""
                      ),
                      "location": ranked_job.get(
                          "location",
                          ""
                      ),
                      "score": ranked_job.get(
                          "score",
                          ""
                      ),
                      "url": ranked_job.get(
                          "url",
                          ""
                      ),
                      "tex_path": str(
                          tex_path
                      ),
                      "tailoring_path": str(
                          tailoring_path
                      ),
                  })

                  print(
                      f"SUCCESS: {job_key}"
                  )

              except Exception as exc:
                  failures.append({
                      "rank": index,
                      "job_id": job_id,
                      "job_key": job_key,
                      "title": ranked_job.get(
                          "title",
                          ""
                      ),
                      "company": ranked_job.get(
                          "company",
                          ""
                      ),
                      "reason": str(exc),
                  })

                  print(
                      f"FAILED: {job_key}: {exc}"
                  )

              if index < len(selected):
                  print(
                      "Waiting 90 seconds before the next Gemini request..."
                  )
                  time.sleep(
                      90
                  )

          Path(
              "jobs/tailoring-results.json"
          ).write_text(
              json.dumps(
                  {
                      "requested": len(selected),
                      "successful": len(results),
                      "failed": len(failures),
                      "results": results,
                      "failures": failures,
                  },
                  indent=2,
                  ensure_ascii=False,
              )
          )

          print(
              f"\nTailoring complete: {len(results)} successful, "
              f"{len(failures)} failed, {len(selected)} requested."
          )

          if len(results) < MINIMUM_JOBS:
              raise RuntimeError(
                  f"Only {len(results)} tailored resumes were generated; "
                  f"at least {MINIMUM_JOBS} are required."
              )
          PY

      - name: Compile tailored resumes
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra poppler-utils

          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          base = Path(
              "jobs/tailored-resumes"
          )

          data = json.loads(
              Path(
                  "jobs/tailoring-results.json"
              ).read_text()
          )

          successful = []

          for item in data["results"]:
              job_key = item["job_key"]

              tex_path = Path(
                  item["tex_path"]
              )

              work_dir = (
                  base /
                  f"build-{job_key}"
              )

              work_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              work_tex = (
                  work_dir /
                  f"{job_key}.tex"
              )

              shutil.copy2(
                  tex_path,
                  work_tex
              )

              print(
                  f"Compiling {job_key}..."
              )

              result = subprocess.run(
                  [
                      "pdflatex",
                      "-interaction=nonstopmode",
                      "-halt-on-error",
                      f"{job_key}.tex",
                  ],
                  cwd=work_dir,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )

              if (
                  result.returncode != 0
                  or not (
                      work_dir /
                      f"{job_key}.pdf"
                  ).is_file()
              ):
                  item["resume_status"] = (
                      "FAILED_COMPILE"
                  )

                  item["compile_error"] = (
                      result.stdout[-4000:]
                      + "\n"
                      + result.stderr[-2000:]
                  )

                  print(
                      f"FAILED COMPILE: {job_key}"
                  )

                  print(
                      "----- pdflatex stdout -----"
                  )

                  print(
                      result.stdout[-4000:]
                  )

                  print(
                      "----- pdflatex stderr -----"
                  )

                  print(
                      result.stderr[-2000:]
                  )

                  print(
                      "----- end pdflatex error -----"
                  )

                  continue

              pdf_path = (
                  base /
                  f"{job_key}.pdf"
              )

              shutil.copy2(
                  work_dir /
                  f"{job_key}.pdf",
                  pdf_path
              )

              info = subprocess.run(
                  [
                      "pdfinfo",
                      str(pdf_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              pages = None

              for line in info.stdout.splitlines():
                  if line.startswith("Pages:"):
                      pages = int(
                          line.split(
                              ":",
                              1
                          )[1].strip()
                      )
                      break

              item["resume_status"] = (
                  "SUCCESS"
              )

              item["pdf_path"] = str(
                  pdf_path
              )

              item["pages"] = pages

              successful.append(
                  item
              )

              shutil.rmtree(
                  work_dir,
                  ignore_errors=True
              )

              tex_path.unlink(
                  missing_ok=True
              )

              Path(
                  item["tailoring_path"]
              ).unlink(
                  missing_ok=True
              )

          data["results"] = successful

          data["successful"] = len(
              successful
          )

          Path(
              "jobs/tailoring-results.json"
          ).write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          if len(successful) < 1:
              raise RuntimeError(
                  f"Only {len(successful)} PDFs compiled successfully; "
                  f"at least 1 is required."
              )

          print(
              f"Compiled PDFs: {len(successful)}"
          )
          PY

