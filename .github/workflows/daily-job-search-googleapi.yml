      - name: Create Excel job tracker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from openpyxl import Workbook
          from openpyxl.styles import Font

          ranked_data = json.loads(
              Path(
                  "jobs/ranked.json"
              ).read_text()
          )

          ranked = ranked_data.get(
              "results",
              []
          )

          detailed = json.loads(
              Path(
                  "jobs/detailed.json"
              ).read_text()
          )

          tailoring = json.loads(
              Path(
                  "jobs/tailoring-results.json"
              ).read_text()
          )

          detailed_by_id = {
              str(job.get("id")): job
              for job in detailed.get(
                  "results",
                  []
              )
          }

          tailoring_by_id = {
              str(item["job_id"]): item
              for item in tailoring.get(
                  "results",
                  []
              )
          }

          wb = Workbook()

          ws = wb.active
          ws.title = "Job Tracker"

          headers = [
              "Rank",
              "Job Key",
              "Job ID",
              "Title",
              "Company",
              "Location",
              "Score",
              "Date",
              "Experience",
              "Matched Skills",
              "Missing Skills",
              "Why This Job",
              "Job URL",
              "Resume Status",
              "Pages",
              "Tailored Resume",
              "Full Job Description",
              "Requirements",
          ]

          ws.append(headers)

          for row in ws.iter_rows(
              min_row=1,
              max_row=1
          ):
              for cell in row:
                  cell.font = Font(
                      bold=True
                  )

          for rank, job in enumerate(
              ranked,
              1
          ):
              if rank > 1:
                  break
              job_id = str(
                  job.get(
                      "job_id",
                      ""
                  )
              )

              detail = detailed_by_id.get(
                  job_id,
                  {}
              )

              result = tailoring_by_id.get(
                  job_id,
                  {}
              )

              job_key = result.get(
                  "job_key",
                  ""
              )

              resume_file = (
                  f"tailored-resumes/{job_key}.pdf"
                  if job_key
                  else ""
              )

              ws.append([
                  rank,
                  job_key,
                  job_id,
                  job.get(
                      "title",
                      ""
                  ),
                  job.get(
                      "company",
                      ""
                  ),
                  job.get(
                      "location",
                      ""
                  ),
                  job.get(
                      "score",
                      ""
                  ),
                  job.get(
                      "date",
                      detail.get(
                          "date",
                          ""
                      )
                  ),
                  detail.get(
                      "experience",
                      ""
                  ),
                  ", ".join(
                      result.get(
                          "matched_skills",
                          []
                      )
                  ),
                  ", ".join(
                      result.get(
                          "missing_skills",
                          []
                      )
                  ),
                  "; ".join(
                      job.get(
                          "reasons",
                          []
                      )
                  ),
                  job.get(
                      "url",
                      ""
                  ),
                  result.get(
                      "resume_status",
                      ""
                  ),
                  result.get(
                      "pages",
                      ""
                  ),
                  resume_file,
                  detail.get(
                      "description",
                      ""
                  ),
                  detail.get(
                      "requirements",
                      ""
                  ),
              ])

              row = ws.max_row

              if resume_file:
                  ws.cell(
                      row=row,
                      column=16
                  ).hyperlink = resume_file

                  ws.cell(
                      row=row,
                      column=16
                  ).font = Font(
                      color="0000FF",
                      underline="single",
                  )

          output_path = Path(
              "jobs/job-tracker.xlsx"
          )

          wb.save(
              output_path
          )

          print(
              f"Excel tracker created: {output_path}"
          )
          PY

