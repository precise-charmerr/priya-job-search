name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search jobs across locations and queries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          cli = ".agents/skills/linkedin-search/cli/src/cli.ts"

          queries = [
              "Java Backend Developer",
              "Java Developer Spring Boot",
              "Java Microservices",
              "Spring Boot Backend",
              "Java Software Engineer",
          ]

          locations = [
              ("pune", "Pune, Maharashtra, India"),
              ("gurugram", "Gurugram, Haryana, India"),
              ("noida", "Noida, Uttar Pradesh, India"),
              ("bengaluru", "Bengaluru, Karnataka, India"),
              ("hyderabad", "Hyderabad, Telangana, India"),
              ("remote", "Remote India"),
          ]

          total = 0

          for location_key, location in locations:
              for query_index, query in enumerate(queries, 1):
                  output_file = Path(
                      f"jobs/search-{location_key}-{query_index}.json"
                  )

                  print(f"Searching: {query} | {location}")

                  try:
                      result = subprocess.run(
                          [
                              "bun",
                              "run",
                              cli,
                              "search",
                              "--query",
                              query,
                              "--location",
                              location,
                              "--jobage",
                              "1",
                              "--limit",
                              "8",
                              "--format",
                              "json",
                          ],
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )

                      if result.returncode == 0:
                          output_file.write_text(result.stdout)
                          total += 1
                      else:
                          print(
                              f"Search failed for {query} | {location}: "
                              f"{result.stderr[:500]}"
                          )

                  except Exception as exc:
                      print(
                          f"Search error for {query} | {location}: {exc}"
                      )

          print(f"Successful searches: {total}/30")
          PY

      - name: Combine and deduplicate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("search-*.json"):
              try:
                  data = json.loads(file.read_text())
              except Exception as exc:
                  print(f"Skipping invalid {file}: {exc}")
                  continue

              for job in data.get("results", []):
                  job_id = job.get("id")

                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs,
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Fetch job details
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          cli = ".agents/skills/linkedin-search/cli/src/cli.ts"

          data = json.loads(
              Path("jobs/all.json").read_text()
          )

          detailed = []
          results = data.get("results", [])

          for i, job in enumerate(results, 1):
              job_id = job["id"]

              print(
                  f"[{i}/{len(results)}] "
                  f"Fetching {job_id} - {job.get('title', '')}"
              )

              try:
                  result = subprocess.run(
                      [
                          "bun",
                          "run",
                          cli,
                          "detail",
                          job_id,
                          "--format",
                          "json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  if result.returncode == 0:
                      detail = json.loads(result.stdout)

                      if isinstance(detail, dict):
                          job.update(detail)

                  else:
                      print(
                          f"Detail fetch failed for {job_id}: "
                          f"{result.stderr[:300]}"
                      )

                  detailed.append(job)

              except Exception as exc:
                  print(
                      f"Error fetching {job_id}: {exc}"
                  )
                  detailed.append(job)

              time.sleep(1)

          Path("jobs/detailed.json").write_text(
              json.dumps(
                  {
                      "count": len(detailed),
                      "results": detailed,
                  },
                  indent=2,
              )
          )

          print(
              f"Detailed jobs collected: {len(detailed)}"
          )
          PY

      - name: Create ranked report
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          profile = json.loads(
              Path("config/job-profile.json").read_text()
          )

          data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          target_roles = profile.get(
              "target_roles",
              {}
          )

          primary_roles = [
              x.lower()
              for x in target_roles.get("primary", [])
          ]

          secondary_roles = [
              x.lower()
              for x in target_roles.get("secondary", [])
          ]

          experience = profile.get(
              "experience",
              {}
          )

          current_years = float(
              experience.get("current_years", 0)
          )

          minimum_years = float(
              experience.get("minimum_years", 0)
          )

          ideal_minimum_years = float(
              experience.get("ideal_minimum_years", 0)
          )

          ideal_maximum_years = float(
              experience.get("ideal_maximum_years", 0)
          )

          maximum_years = float(
              experience.get("maximum_years", 0)
          )

          skills = profile.get(
              "skills",
              {}
          )

          must_have = [
              x.lower()
              for x in skills.get("must_have", [])
          ]

          high_value = [
              x.lower()
              for x in skills.get("high_value", [])
          ]

          supporting = [
              x.lower()
              for x in skills.get("supporting", [])
          ]

          bonus = [
              x.lower()
              for x in skills.get("bonus", [])
          ]

          locations = {
              k.lower(): float(v)
              for k, v in profile.get(
                  "locations",
                  {}
              ).items()
          }

          avoid = [
              x.lower()
              for x in profile.get("avoid", [])
          ]

          daily_target = int(
              profile.get("daily_target", 50)
          )

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "").lower()
              ).strip()

          def job_text(job):
              return " ".join(
                  [
                      str(job.get("title", "")),
                      str(job.get("description", "")),
                      str(job.get("requirements", "")),
                      str(job.get("experience", "")),
                  ]
              )

          def extract_experience_range(text):
              patterns = [
                  (
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:-|–|—|to)\s*"
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:\+)?\s*(?:years?|yrs?)"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*\+\s*"
                      r"(?:years?|yrs?)"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:years?|yrs?)"
                  ),
              ]

              ranges = []

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  ):
                      if match.lastindex == 2:
                          low = float(match.group(1))
                          high = float(match.group(2))

                          ranges.append(
                              (low, high, False)
                          )
                      else:
                          low = float(match.group(1))

                          if "+" in match.group(0):
                              ranges.append(
                                  (low, float("inf"), True)
                              )
                          else:
                              ranges.append(
                                  (low, low, False)
                              )

              if not ranges:
                  return None

              return ranges

          def experience_score(text):
              ranges = extract_experience_range(text)

              if not ranges:
                  return 0, None

              best_score = 0
              best_range = None

              for low, high, open_ended in ranges:
                  if (
                      high < minimum_years
                      or low > maximum_years
                  ):
                      continue

                  if (
                      low <= ideal_minimum_years
                      and (
                          open_ended
                          or high >= ideal_maximum_years
                      )
                  ):
                      score = 20
                  elif (
                      low <= current_years
                      and (
                          open_ended
                          or high >= current_years
                      )
                  ):
                      score = 16
                  elif (
                      low <= ideal_maximum_years
                      and (
                          open_ended
                          or high >= ideal_minimum_years
                      )
                  ):
                      score = 12
                  else:
                      score = 8

                  if score > best_score:
                      best_score = score
                      best_range = (low, high)

              return best_score, best_range

          def role_score(title):
              normalized = normalize(title)

              if normalized in primary_roles:
                  return 30, "Primary role match"

              if any(
                  role in normalized
                  for role in primary_roles
              ):
                  return 25, "Strong role match"

              if normalized in secondary_roles:
                  return 20, "Secondary role match"

              if any(
                  role in normalized
                  for role in secondary_roles
              ):
                  return 15, "Related role match"

              return 0, "Weak role match"

          def skill_score(text):
              score = 0
              matched = []
              missing = []

              for skill in must_have:
                  if skill in text:
                      score += 20
                      matched.append(skill)
                  else:
                      missing.append(skill)

              for skill in high_value:
                  if skill in text:
                      score += 6
                      matched.append(skill)

              for skill in supporting:
                  if skill in text:
                      score += 3
                      matched.append(skill)

              for skill in bonus:
                  if skill in text:
                      score += 1
                      matched.append(skill)

              return min(score, 30), matched, missing

          def location_score(location):
              normalized = normalize(location)

              best = 0
              best_match = None

              for location_name, score in locations.items():
                  if location_name in normalized:
                      if score > best:
                          best = score
                          best_match = location_name

              return best, best_match

          ranked = []

          for job in data.get("results", []):
              title = job.get("title", "")
              location = job.get("location", "")
              text = normalize(job_text(job))

              role_points, role_reason = role_score(title)
              skill_points, matched, missing = skill_score(text)
              loc_points, loc_match = location_score(location)
              exp_points, exp_range = experience_score(text)

              avoid_matches = [
                  term
                  for term in avoid
                  if term in text
              ]

              avoid_penalty = len(avoid_matches) * 20

              mode_points = 0
              mode_reason = ""

              if "remote" in normalize(location):
                  mode_points = 10
                  mode_reason = "Remote"
              elif "hybrid" in text:
                  mode_points = 8
                  mode_reason = "Hybrid"
              elif "onsite" in text or "on-site" in text:
                  mode_points = 6
                  mode_reason = "Onsite"

              total_score = (
                  role_points
                  + skill_points
                  + loc_points * 0.2
                  + exp_points
                  + mode_points
                  - avoid_penalty
              )

              reasons = [
                  role_reason,
                  f"Skills: {len(matched)} matched",
              ]

              if loc_match:
                  reasons.append(
                      f"Location: {loc_match}"
                  )

              if exp_range:
                  reasons.append(
                      f"Experience: {exp_range[0]}-{exp_range[1]}"
                  )

              if mode_reason:
                  reasons.append(mode_reason)

              if avoid_matches:
                  reasons.append(
                      f"Avoid terms: {', '.join(avoid_matches)}"
                  )

              job_copy = dict(job)

              job_copy["score"] = round(
                  total_score,
                  2
              )

              job_copy["matched_skills"] = sorted(
                  set(matched)
              )

              job_copy["missing_skills"] = sorted(
                  set(missing)
              )

              job_copy["experience_score"] = exp_points
              job_copy["role_score"] = role_points
              job_copy["skill_score"] = skill_points
              job_copy["location_score"] = loc_points
              job_copy["mode_score"] = mode_points
              job_copy["reasons"] = reasons

              ranked.append(job_copy)

          ranked.sort(
              key=lambda job: (
                  job.get("score", 0),
                  job.get("role_score", 0),
                  job.get("skill_score", 0),
                  job.get("experience_score", 0),
              ),
              reverse=True,
          )

          for rank, job in enumerate(
              ranked,
              1
          ):
              job["rank"] = rank

          output = {
              "generated_on": date.today().isoformat(),
              "count": len(ranked),
              "daily_target": daily_target,
              "results": ranked,
          }

          Path("jobs/ranked.json").write_text(
              json.dumps(
                  output,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          print(
              f"Ranked jobs: {len(ranked)}"
          )
          PY

      - name: Tailor top 5 jobs with multi-provider structured tailoring
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          ranked_data = json.loads(
              Path("jobs/ranked.json").read_text()
          )

          detailed_data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          candidate_skills = json.loads(
              Path("config/candidate-skills.json").read_text()
          )

          master_resume = Path(
              "resume/master_resume.tex"
          ).read_text()

          ranked = ranked_data.get("results", [])

          if not isinstance(ranked, list):
              raise RuntimeError(
                  "Expected ranked results to be a list."
              )

          detailed_by_id = {
              str(job.get("id")): job
              for job in detailed_data.get("results", [])
          }

          # TODO CHANGE HERE: set 60 for the full batch run
          TARGET_JOBS = min(len(ranked), 5)
          MINIMUM_JOBS = 1

          selected = ranked[:TARGET_JOBS]

          output_dir = Path("jobs/tailored-resumes")
          output_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          PROVIDER_CHAIN = [
              "gemini",
              "openrouter",
              "groq",
              "cerebras",
              "huggingface",
          ]

          TAILORING_SCHEMA = {
              "type": "object",
              "properties": {
                  "profile_summary": {
                      "type": "string"
                  },
                  "experience_bullets": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "source": {
                                  "type": "string"
                              },
                              "rewrite": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "source",
                              "rewrite"
                          ],
                          "additionalProperties": False
                      }
                  },
                  "project_bullets": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "source": {
                                  "type": "string"
                              },
                              "rewrite": {
                                  "type": "string"
                              }
                          },
                          "required": [
                              "source",
                              "rewrite"
                          ],
                          "additionalProperties": False
                      }
                  },
                  "recommended_skill_order": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  },
                  "tailoring_notes": {
                      "type": "array",
                      "items": {
                          "type": "string"
                      }
                  }
              },
              "required": [
                  "profile_summary",
                  "experience_bullets",
                  "project_bullets",
                  "recommended_skill_order",
                  "tailoring_notes"
              ],
              "additionalProperties": False
          }

          def parse_json_object(text):
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  start = text.find("{")
                  end = text.rfind("}")

                  if start >= 0 and end > start:
                      return json.loads(
                          text[start:end + 1]
                      )

                  raise

          def post_json(
              url,
              payload,
              headers,
          ):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )

              with urllib.request.urlopen(
                  request,
                  timeout=180,
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          def remove_additional_properties(schema):
              if isinstance(schema, dict):
                  return {
                      key: remove_additional_properties(value)
                      for key, value in schema.items()
                      if key != "additionalProperties"
                  }

              if isinstance(schema, list):
                  return [
                      remove_additional_properties(item)
                      for item in schema
                  ]

              return schema

          def call_gemini(prompt):
              api_key = os.environ.get("GEMINI_API_KEY")

              if not api_key:
                  raise RuntimeError(
                      "GEMINI_API_KEY is not configured."
                  )

              payload = {
                  "contents": [
                      {
                          "role": "user",
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "responseMimeType": "application/json",
                      "responseSchema": remove_additional_properties(
                          TAILORING_SCHEMA
                      ),
                      "temperature": 0.2,
                  }
              }

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/gemini-3.7-flash:generateContent"
                  f"?key={api_key}"
              )

              response = post_json(
                  url,
                  payload,
                  {
                      "Content-Type": "application/json"
                  },
              )

              candidates = response.get(
                  "candidates",
                  []
              )

              if not candidates:
                  raise RuntimeError(
                      "Gemini returned no candidates."
                  )

              parts = candidates[0].get(
                  "content",
                  {}
              ).get(
                  "parts",
                  []
              )

              output = "".join(
                  part.get("text", "")
                  for part in parts
                  if isinstance(part, dict)
                  and isinstance(part.get("text"), str)
              )

              if not output.strip():
                  raise RuntimeError(
                      "Gemini returned no text content."
                  )

              return parse_json_object(output)

          def call_openai_compatible(
              provider,
              url,
              api_key,
              model,
              prompt,
              extra_headers=None,
          ):
              payload = {
                  "model": model,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt,
                      }
                  ],
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "resume_tailoring",
                          "strict": True,
                          "schema": TAILORING_SCHEMA,
                      }
                  },
                  "max_tokens": 6000,
              }

              headers = {
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              }

              if extra_headers:
                  headers.update(extra_headers)

              response = post_json(
                  url,
                  payload,
                  headers,
              )

              choices = response.get(
                  "choices",
                  []
              )

              if not choices:
                  raise RuntimeError(
                      f"{provider} returned no choices."
                  )

              content = choices[0].get(
                  "message",
                  {}
              ).get("content")

              if not isinstance(content, str) or not content.strip():
                  raise RuntimeError(
                      f"{provider} returned no usable text content."
                  )

              return parse_json_object(content)

          def call_provider(
              provider,
              prompt,
          ):
              if provider == "gemini":
                  return call_gemini(prompt)

              if provider == "openrouter":
                  api_key = os.environ.get(
                      "OPENROUTER_API_KEY"
                  )

                  if not api_key:
                      raise RuntimeError(
                          "OPENROUTER_API_KEY is not configured."
                      )

                  return call_openai_compatible(
                      "OpenRouter",
                      "https://openrouter.ai/api/v1/chat/completions",
                      api_key,
                      "openrouter/free",
                      prompt,
                      {
                          "HTTP-Referer": (
                              "https://github.com/"
                              "precise-charmerr/priya-job-search"
                          ),
                          "X-Title": "Priya Job Search",
                      },
                  )

              if provider == "groq":
                  api_key = os.environ.get("GROQ_API_KEY")

                  if not api_key:
                      raise RuntimeError(
                          "GROQ_API_KEY is not configured."
                      )

                  return call_openai_compatible(
                      "Groq",
                      "https://api.groq.com/openai/v1/chat/completions",
                      api_key,
                      "openai/gpt-oss-120b",
                      prompt,
                  )

              if provider == "cerebras":
                  api_key = os.environ.get("CEREBRAS_API_KEY")

                  if not api_key:
                      raise RuntimeError(
                          "CEREBRAS_API_KEY is not configured."
                      )

                  return call_openai_compatible(
                      "Cerebras",
                      "https://api.cerebras.ai/v1/chat/completions",
                      api_key,
                      "gpt-oss-120b",
                      prompt,
                  )

              if provider == "huggingface":
                  api_key = os.environ.get("HF_TOKEN")

                  if not api_key:
                      raise RuntimeError(
                          "HF_TOKEN is not configured."
                      )

                  return call_openai_compatible(
                      "Hugging Face",
                      "https://router.huggingface.co/v1/chat/completions",
                      api_key,
                      "Qwen/Qwen3-32B",
                      prompt,
                  )

              raise RuntimeError(
                  f"Unknown provider: {provider}"
              )

          def normalize_text(value):
              value = re.sub(
                  r"\\[A-Za-z]+\{([^{}]*)\}",
                  r"\1",
                  value,
              )
              value = re.sub(
                  r"[^A-Za-z0-9]+",
                  " ",
                  value,
              )
              return " ".join(
                  value.lower().split()
              )

          def replace_profile(tex, new_profile):
              pattern = re.compile(
                  r"(\\section\*?\{PROFILE\})(.*?)(?=\\section\*?\{WORK EXPERIENCE\})",
                  re.IGNORECASE | re.DOTALL,
              )

              replacement = (
                  r"\1"
                  + "\n"
                  + "\n"
                  + new_profile.strip()
                  + "\n\n"
              )

              updated, count = pattern.subn(
                  replacement,
                  tex,
                  count=1,
              )

              if count != 1:
                  raise RuntimeError(
                      "Could not locate PROFILE section in master resume."
                  )

              return updated

          def replace_bullets(tex, rewrites):
              updated = tex

              for rewrite in rewrites:
                  source = str(
                      rewrite.get("source", "")
                  ).strip()

                  replacement = str(
                      rewrite.get("rewrite", "")
                  ).strip()

                  if not source or not replacement:
                      continue

                  source_words = set(
                      normalize_text(source).split()
                  )

                  if not source_words:
                      continue

                  lines = updated.splitlines()

                  best_index = None
                  best_score = 0.0

                  for i, line in enumerate(lines):
                      if "\\item" not in line:
                          continue

                      item_text = line.split(
                          "\\item",
                          1
                      )[1].strip()

                      item_words = set(
                          normalize_text(item_text).split()
                      )

                      if not item_words:
                          continue

                      overlap = len(
                          source_words & item_words
                      ) / max(
                          1,
                          len(source_words)
                      )

                      if overlap > best_score:
                          best_score = overlap
                          best_index = i

                  if (
                      best_index is not None
                      and best_score >= 0.55
                  ):
                      prefix = lines[best_index].split(
                          "\\item",
                          1
                      )[0]

                      lines[best_index] = (
                          prefix
                          + "\\item "
                          + replacement
                      )

                      updated = "\n".join(lines)

              return updated

          def generate_tailoring(prompt):
              errors = []

              for provider in PROVIDER_CHAIN:
                  try:
                      data = call_provider(
                          provider,
                          prompt,
                      )

                      if not isinstance(data, dict):
                          raise RuntimeError(
                              "Provider returned a non-object response."
                          )

                      required_keys = [
                          "profile_summary",
                          "experience_bullets",
                          "project_bullets",
                          "recommended_skill_order",
                          "tailoring_notes",
                      ]

                      missing = [
                          key
                          for key in required_keys
                          if key not in data
                      ]

                      if missing:
                          raise RuntimeError(
                              "Provider returned incomplete tailoring JSON; "
                              f"missing: {missing}"
                          )

                      if not isinstance(
                          data.get("profile_summary"),
                          str,
                      ) or not data["profile_summary"].strip():
                          raise RuntimeError(
                              "Provider returned an empty profile_summary."
                          )

                      if not isinstance(
                          data.get("experience_bullets"),
                          list,
                      ):
                          raise RuntimeError(
                              "experience_bullets must be a list."
                          )

                      if not isinstance(
                          data.get("project_bullets"),
                          list,
                      ):
                          raise RuntimeError(
                              "project_bullets must be a list."
                          )

                      print(
                          f"Provider succeeded: {provider}"
                      )

                      return data, provider

                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode(
                          "utf-8",
                          errors="replace",
                      )

                      message = (
                          f"{provider}: HTTP {exc.code}: "
                          f"{body[:1000]}"
                      )

                      errors.append(message)
                      print(
                          f"Provider failed: {message}"
                      )

                      continue

                  except Exception as exc:
                      message = (
                          f"{provider}: {exc}"
                      )

                      errors.append(message)
                      print(
                          f"Provider failed: {message}"
                      )

                      continue

              raise RuntimeError(
                  "All providers failed: "
                  + " | ".join(errors)
              )

          results = []
          failures = []

          for index, ranked_job in enumerate(
              selected,
              1
          ):
              job_id = str(
                  ranked_job.get(
                      "job_id",
                      ranked_job.get(
                          "id",
                          ""
                      )
                  )
              )

              detailed_job = detailed_by_id.get(
                  job_id,
                  ranked_job
              )

              title = ranked_job.get(
                  "title",
                  ""
              )

              company = ranked_job.get(
                  "company",
                  ""
              )

              job_key = re.sub(
                  r"[^A-Za-z0-9_-]",
                  "",
                  job_id,
              )[:24]

              print(
                  f"[{index}/{len(selected)}] "
                  f"Tailoring {title} | {company} | "
                  f"ID {job_id} | KEY {job_key}"
              )

              prompt = f"""
          You are a resume-tailoring engine.

          Tailor the candidate's existing one-page resume for the supplied job.

          FACTUAL RULES:
          - Use ONLY facts in the master resume.
          - Never invent an employer, date, technology, metric, responsibility,
            project, certification, or achievement.
          - Do NOT generate LaTeX.
          - Return JSON matching the supplied schema.
          - Rewrite only existing experience/project bullets.
          - Every "source" must correspond closely to an existing master-resume bullet.
          - Every "rewrite" must preserve the factual meaning of its source.
          - The profile_summary must remain fully factual and concise.
          - Prefer terminology already present in the candidate's resume/skills.
          - Do not claim a skill merely because the job description requests it.
          - recommended_skill_order must use only skills already present in the
            candidate skills/master resume.

          CANDIDATE SKILLS:
          {json.dumps(candidate_skills, indent=2, ensure_ascii=False)}

          MASTER RESUME:
          {master_resume}

          JOB INFORMATION:
          {json.dumps(
              detailed_job,
              indent=2,
              ensure_ascii=False,
          )}

          RANKING INFORMATION:
          {json.dumps(
              {
                  "rank": ranked_job.get("rank"),
                  "score": ranked_job.get("score"),
                  "matched_skills": ranked_job.get(
                      "matched_skills",
                      []
                  ),
                  "missing_skills": ranked_job.get(
                      "missing_skills",
                      []
                  ),
                  "reasons": ranked_job.get(
                      "reasons",
                      []
                  ),
              },
              indent=2,
              ensure_ascii=False,
          )}

          OUTPUT:
          - profile_summary: replacement profile paragraph.
          - experience_bullets: up to 5 source/rewrite pairs.
          - project_bullets: up to 3 source/rewrite pairs.
          - recommended_skill_order: relevant existing skills in priority order.
          - tailoring_notes: concise notes explaining the tailoring choices.

          Do not output Markdown, code fences, or LaTeX.
          """

              try:
                  tailoring, provider_used = (
                      generate_tailoring(prompt)
                  )

                  if not isinstance(
                      tailoring,
                      dict
                  ):
                      raise RuntimeError(
                          "Provider returned non-object tailoring data."
                      )

                  profile_summary = tailoring.get(
                      "profile_summary",
                      ""
                  ).strip()

                  if not profile_summary:
                      raise RuntimeError(
                          "Provider returned an empty profile_summary."
                      )

                  tailored_tex = replace_profile(
                      master_resume,
                      profile_summary,
                  )

                  tailored_tex = replace_bullets(
                      tailored_tex,
                      tailoring.get(
                          "experience_bullets",
                          []
                      ),
                  )

                  tailored_tex = replace_bullets(
                      tailored_tex,
                      tailoring.get(
                          "project_bullets",
                          []
                      ),
                  )

                  if (
                      not tailored_tex.strip()
                      or not tailored_tex.lstrip().startswith(
                          "\\documentclass"
                      )
                  ):
                      raise RuntimeError(
                          "Generated resume source is invalid."
                      )

                  tex_path = (
                      output_dir /
                      f"{job_key}.tex"
                  )

                  tailoring_path = (
                      output_dir /
                      f"{job_key}.json"
                  )

                  tex_path.write_text(
                      tailored_tex
                  )

                  tailoring_record = {
                      "job": {
                          "id": job_id,
                          "job_key": job_key,
                          "title": title,
                          "company": company,
                          "location": ranked_job.get(
                              "location",
                              ""
                          ),
                          "url": ranked_job.get(
                              "url",
                              ""
                          ),
                      },
                      "provider": provider_used,
                      "rank": index,
                      "score": ranked_job.get(
                          "score",
                          ""
                      ),
                      **tailoring,
                  }

                  tailoring_path.write_text(
                      json.dumps(
                          tailoring_record,
                          indent=2,
                          ensure_ascii=False,
                      )
                  )

                  results.append({
                      "provider": provider_used,
                      "rank": index,
                      "job_key": job_key,
                      "job_id": job_id,
                      "title": title,
                      "company": company,
                      "location": ranked_job.get(
                          "location",
                          ""
                      ),
                      "score": ranked_job.get(
                          "score",
                          ""
                      ),
                      "url": ranked_job.get(
                          "url",
                          ""
                      ),
                      "tex_path": str(tex_path),
                      "tailoring_path": str(tailoring_path),
                  })

                  print(
                      f"SUCCESS: {job_key} via {provider_used}"
                  )

              except Exception as exc:
                  failures.append({
                      "rank": index,
                      "job_id": job_id,
                      "job_key": job_key,
                      "title": title,
                      "company": company,
                      "reason": str(exc),
                  })

                  print(
                      f"FAILED: {job_key}: {exc}"
                  )

              if index < len(selected):
                  print(
                      "Waiting 90 seconds before the next request..."
                  )
                  time.sleep(90)

          Path(
              "jobs/tailoring-results.json"
          ).write_text(
              json.dumps(
                  {
                      "requested": len(selected),
                      "successful": len(results),
                      "failed": len(failures),
                      "results": results,
                      "failures": failures,
                  },
                  indent=2,
                  ensure_ascii=False,
              )
          )

          print(
              f"\nTailoring complete: {len(results)} successful, "
              f"{len(failures)} failed, {len(selected)} requested."
          )

          if len(results) < MINIMUM_JOBS:
              raise RuntimeError(
                  f"Only {len(results)} tailored resumes were generated; "
                  f"at least {MINIMUM_JOBS} are required."
              )
          PY

      - name: Compile tailored resumes
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra poppler-utils

          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          base = Path(
              "jobs/tailored-resumes"
          )

          data = json.loads(
              Path(
                  "jobs/tailoring-results.json"
              ).read_text()
          )

          successful = []

          for item in data["results"]:
              job_key = item["job_key"]

              tex_path = Path(
                  item["tex_path"]
              )

              work_dir = (
                  base /
                  f"build-{job_key}"
              )

              work_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              work_tex = (
                  work_dir /
                  f"{job_key}.tex"
              )

              shutil.copy2(
                  tex_path,
                  work_tex
              )

              print(
                  f"Compiling {job_key}..."
              )

              result = subprocess.run(
                  [
                      "pdflatex",
                      "-interaction=nonstopmode",
                      "-halt-on-error",
                      f"{job_key}.tex",
                  ],
                  cwd=work_dir,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )

              if (
                  result.returncode != 0
                  or not (
                      work_dir /
                      f"{job_key}.pdf"
                  ).is_file()
              ):
                  item["resume_status"] = (
                      "FAILED_COMPILE"
                  )

                  item["compile_error"] = (
                      result.stdout[-4000:]
                      + "\n"
                      + result.stderr[-2000:]
                  )

                  print(
                      f"FAILED COMPILE: {job_key}"
                  )

                  print(
                      "----- pdflatex stdout -----"
                  )

                  print(
                      result.stdout[-4000:]
                  )

                  print(
                      "----- pdflatex stderr -----"
                  )

                  print(
                      result.stderr[-2000:]
                  )

                  print(
                      "----- end pdflatex error -----"
                  )

                  continue

              pdf_path = (
                  base /
                  f"{job_key}.pdf"
              )

              shutil.copy2(
                  work_dir /
                  f"{job_key}.pdf",
                  pdf_path
              )

              info = subprocess.run(
                  [
                      "pdfinfo",
                      str(pdf_path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              pages = None

              for line in info.stdout.splitlines():
                  if line.startswith("Pages:"):
                      pages = int(
                          line.split(
                              ":",
                              1
                          )[1].strip()
                      )
                      break

              item["resume_status"] = (
                  "SUCCESS"
              )

              item["pdf_path"] = str(
                  pdf_path
              )

              item["pages"] = pages

              successful.append(
                  item
              )

              shutil.rmtree(
                  work_dir,
                  ignore_errors=True
              )

              tex_path.unlink(
                  missing_ok=True
              )

              Path(
                  item["tailoring_path"]
              ).unlink(
                  missing_ok=True
              )

          data["results"] = successful

          data["successful"] = len(
              successful
          )

          Path(
              "jobs/tailoring-results.json"
          ).write_text(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False,
              )
          )

          if len(successful) < 1:
              raise RuntimeError(
                  f"Only {len(successful)} PDFs compiled successfully; "
                  f"at least 1 is required."
              )

          print(
              f"Compiled PDFs: {len(successful)}"
          )
          PY

