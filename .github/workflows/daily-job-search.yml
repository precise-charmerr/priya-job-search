name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search jobs across locations and queries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          queries = [
              "Java Backend Developer",
              "Java Developer Spring Boot",
              "Java Microservices",
              "Spring Boot Backend",
              "Java Software Engineer",
          ]

          locations = [
              ("pune", "Pune, Maharashtra, India"),
              ("gurugram", "Gurugram, Haryana, India"),
              ("noida", "Noida, Uttar Pradesh, India"),
              ("bengaluru", "Bengaluru, Karnataka, India"),
              ("hyderabad", "Hyderabad, Telangana, India"),
              ("remote", "Remote India"),
          ]

          total = 0

          for location_key, location in locations:
              for query_index, query in enumerate(queries, 1):
                  output_file = Path(
                      f"jobs/search-{location_key}-{query_index}.json"
                  )

                  print(f"Searching: {query} | {location}")

                  try:
                      result = subprocess.run(
                          [
                              "bun",
                              "run",
                              ".agents/skills/linkedin-search/cli/src/cli.ts",
                              "search",
                              "--query",
                              query,
                              "--location",
                              location,
                              "--jobage",
                              "7",
                              "--limit",
                              "8",
                              "--format",
                              "json",
                          ],
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )

                      if result.returncode == 0:
                          output_file.write_text(result.stdout)
                          total += 1
                      else:
                          print(
                              f"Search failed for {query} | {location}: "
                              f"{result.stderr[:500]}"
                          )

                  except Exception as exc:
                      print(
                          f"Search error for {query} | {location}: {exc}"
                      )

          print(f"Successful searches: {total}/30")
          PY

      - name: Combine and deduplicate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("search-*.json"):
              try:
                  data = json.loads(file.read_text())
              except Exception as exc:
                  print(f"Skipping invalid {file}: {exc}")
                  continue

              for job in data.get("results", []):
                  job_id = job.get("id")

                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs,
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Fetch job details
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          data = json.loads(
              Path("jobs/all.json").read_text()
          )

          detailed = []
          results = data.get("results", [])

          for i, job in enumerate(results, 1):
              job_id = job["id"]

              print(
                  f"[{i}/{len(results)}] "
                  f"Fetching {job_id} - {job['title']}"
              )

              try:
                  result = subprocess.run(
                      [
                          "bun",
                          "run",
                          ".agents/skills/linkedin-search/cli/src/cli.ts",
                          "detail",
                          job_id,
                          "--format",
                          "json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  if result.returncode == 0:
                      detail = json.loads(result.stdout)

                      if isinstance(detail, dict):
                          job.update(detail)

                  else:
                      print(
                          f"Detail fetch failed for {job_id}: "
                          f"{result.stderr[:300]}"
                      )

                  detailed.append(job)

              except Exception as exc:
                  print(
                      f"Error fetching {job_id}: {exc}"
                  )
                  detailed.append(job)

              time.sleep(1)

          Path("jobs/detailed.json").write_text(
              json.dumps(
                  {
                      "count": len(detailed),
                      "results": detailed,
                  },
                  indent=2,
              )
          )

          print(
              f"Detailed jobs collected: {len(detailed)}"
          )
          PY

      - name: Create ranked report
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          profile = json.loads(
              Path("config/job-profile.json").read_text()
          )

          data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          # ---------------------------------------------------------
          # Profile configuration
          # ---------------------------------------------------------

          primary_roles = [
              x.lower()
              for x in profile["target_roles"].get(
                  "primary",
                  []
              )
          ]

          secondary_roles = [
              x.lower()
              for x in profile["target_roles"].get(
                  "secondary",
                  []
              )
          ]

          must_have = [
              x.lower()
              for x in profile["skills"].get(
                  "must_have",
                  []
              )
          ]

          high_value = [
              x.lower()
              for x in profile["skills"].get(
                  "high_value",
                  []
              )
          ]

          supporting = [
              x.lower()
              for x in profile["skills"].get(
                  "supporting",
                  []
              )
          ]

          bonus = [
              x.lower()
              for x in profile["skills"].get(
                  "bonus",
                  []
              )
          ]

          avoid = [
              x.lower()
              for x in profile.get(
                  "avoid",
                  []
              )
          ]

          current_years = float(
              profile["experience"].get(
                  "current_years",
                  0
              )
          )

          minimum_years = float(
              profile["experience"].get(
                  "minimum_years",
                  current_years
              )
          )

          ideal_minimum_years = float(
              profile["experience"].get(
                  "ideal_minimum_years",
                  current_years
              )
          )

          ideal_maximum_years = float(
              profile["experience"].get(
                  "ideal_maximum_years",
                  current_years
              )
          )

          maximum_years = float(
              profile["experience"].get(
                  "maximum_years",
                  current_years
              )
          )

          locations = {
              key.lower(): value
              for key, value in profile.get(
                  "locations",
                  {}
              ).items()
          }

          # ---------------------------------------------------------
          # Experience extraction
          # ---------------------------------------------------------

          def extract_experience_range(text):
              patterns = [
                  r'(\d+(?:\.\d+)?)\s*(?:-|–|—|to)\s*'
                  r'(\d+(?:\.\d+)?)\s*(?:years?|yrs?)',

                  r'(\d+(?:\.\d+)?)\s*\+\s*'
                  r'(?:years?|yrs?)',

                  r'(\d+(?:\.\d+)?)\s*'
                  r'(?:years?|yrs?)\s+'
                  r'(?:of\s+)?'
                  r'(?:relevant\s+)?'
                  r'(?:work\s+)?experience',
              ]

              candidates = []

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  ):
                      if match.lastindex >= 2:
                          low = float(match.group(1))
                          high = float(match.group(2))
                      else:
                          low = float(match.group(1))

                          if "+" in match.group(0):
                              high = None
                          else:
                              high = low

                      if low > 15:
                          continue

                      if high is not None and high > 15:
                          continue

                      candidates.append((low, high))

              if not candidates:
                  return None

              return candidates[0]

          # ---------------------------------------------------------
          # Experience scoring
          #
          # IMPORTANT:
          # For a bounded range such as 4–12, we first evaluate
          # whether the upper bound is too far beyond the user's
          # acceptable maximum.
          #
          # This prevents 4–12 from being classified as a slight
          # stretch merely because its minimum is 4.
          # ---------------------------------------------------------

          def experience_score(text):
              result = extract_experience_range(text)

              if result is None:
                  return (
                      5,
                      0,
                      "Experience: not stated"
                  )

              minimum, maximum = result

              # ---------------------------------------------------
              # Open-ended requirement: "3+ years"
              # ---------------------------------------------------

              if maximum is None:

                  if minimum <= ideal_minimum_years:
                      return (
                          10,
                          0,
                          f"Experience: {minimum:g}+ years "
                          "(ideal fit)"
                      )

                  if minimum <= current_years:
                      return (
                          9,
                          0,
                          f"Experience: {minimum:g}+ years "
                          "(strong fit)"
                      )

                  gap = minimum - current_years

                  if gap <= 1:
                      return (
                          6,
                          5,
                          f"Experience: {minimum:g}+ years "
                          "(slight stretch)"
                      )

                  if gap <= 2:
                      return (
                          3,
                          10,
                          f"Experience: {minimum:g}+ years "
                          "(stretch)"
                      )

                  return (
                      0,
                      20,
                      f"Experience: {minimum:g}+ years "
                      "(mismatch)"
                  )

              # ---------------------------------------------------
              # FIRST: Check upper-bound mismatch.
              #
              # This must happen BEFORE checking the minimum.
              #
              # Example:
              # 4–12
              #
              # minimum = 4 (only slightly above current)
              # maximum = 12 (far beyond acceptable 6)
              #
              # Therefore this is a mismatch.
              # ---------------------------------------------------

              excess = maximum - maximum_years

              if excess >= 4:
                  return (
                      0,
                      20,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(mismatch)"
                  )

              if excess >= 2:
                  return (
                      4,
                      12,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(significant stretch)"
                  )

              if excess > 0:
                  return (
                      6,
                      5,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(slight stretch)"
                  )

              # ---------------------------------------------------
              # Now the range is within the user's maximum
              # acceptable experience.
              # ---------------------------------------------------

              # Entire range is inside ideal range.
              if (
                  minimum >= ideal_minimum_years
                  and maximum <= ideal_maximum_years
              ):
                  return (
                      10,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(ideal fit)"
                  )

              # Range starts below ideal but remains acceptable.
              if (
                  minimum >= minimum_years
                  and maximum <= maximum_years
              ):
                  return (
                      8,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(acceptable fit)"
                  )

              # Candidate has less experience than the job requires.
              if current_years < minimum:

                  gap = minimum - current_years

                  if gap <= 1:
                      return (
                          6,
                          5,
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(slight stretch)"
                      )

                  if gap <= 2:
                      return (
                          3,
                          10,
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(stretch)"
                      )

                  return (
                      0,
                      20,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(mismatch)"
                  )

              # Candidate has more experience than the job range.
              if current_years > maximum:

                  if current_years - maximum <= 1:
                      return (
                          8,
                          0,
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(meets/exceeds)"
                      )

                  return (
                      6,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(above range)"
                  )

              return (
                  5,
                  0,
                  f"Experience: {minimum:g}–{maximum:g} years "
                  "(uncertain fit)"
              )

          # ---------------------------------------------------------
          # Location scoring
          # ---------------------------------------------------------

          def location_score(location):
              location_lower = location.lower()

              best_score = 0
              best_location = None

              for configured_location, value in locations.items():
                  if configured_location in location_lower:
                      if value > best_score:
                          best_score = value
                          best_location = configured_location

              points = round(
                  (best_score / 100) * 3
              )

              if best_location:
                  return (
                      points,
                      f"Location: {best_location.title()}"
                  )

              return (
                  0,
                  "Location: not prioritized"
              )

          # ---------------------------------------------------------
          # Overall job scoring
          # ---------------------------------------------------------

          def score_job(job):
              title = job.get("title", "")
              description = job.get(
                  "description",
                  ""
              ) or ""

              location = job.get(
                  "location",
                  ""
              ) or ""

              title_lower = title.lower()

              text = (
                  f"{title} {description}"
              ).lower()

              score = 0
              reasons = []

              # ---------------------------------------------------
              # Must-have skills
              # ---------------------------------------------------

              must_matches = [
                  skill
                  for skill in must_have
                  if skill in text
              ]

              if must_have:
                  if not must_matches:
                      return (
                          0,
                          [
                              "Missing must-have skill: "
                              + ", ".join(must_have)
                          ]
                      )

                  score += 20

                  reasons.append(
                      "Must-have: "
                      + ", ".join(must_matches)
                  )

              # ---------------------------------------------------
              # Role
              # ---------------------------------------------------

              primary_matches = [
                  role
                  for role in primary_roles
                  if role in title_lower
              ]

              secondary_matches = [
                  role
                  for role in secondary_roles
                  if role in title_lower
              ]

              if primary_matches:
                  score += 20
                  reasons.append(
                      "Primary role"
                  )

              elif secondary_matches:
                  score += 12
                  reasons.append(
                      "Secondary role"
                  )

              else:
                  backend_java_terms = [
                      "backend",
                      "back end",
                      "java developer",
                      "java engineer",
                      "spring boot",
                      "microservices",
                  ]

                  if any(
                      term in title_lower
                      for term in backend_java_terms
                  ):
                      score += 8
                      reasons.append(
                          "Relevant backend role"
                      )

              # ---------------------------------------------------
              # High-value skills
              # ---------------------------------------------------

              high_matches = [
                  skill
                  for skill in high_value
                  if skill in text
              ]

              high_points = min(
                  len(high_matches) * 4,
                  20
              )

              score += high_points

              if high_matches:
                  reasons.append(
                      "High-value skills: "
                      + ", ".join(
                          high_matches[:5]
                      )
                  )

              # ---------------------------------------------------
              # Supporting skills
              # ---------------------------------------------------

              supporting_matches = [
                  skill
                  for skill in supporting
                  if skill in text
              ]

              supporting_points = min(
                  len(supporting_matches) * 1.5,
                  10
              )

              score += supporting_points

              if supporting_matches:
                  reasons.append(
                      "Supporting skills: "
                      + ", ".join(
                          supporting_matches[:5]
                      )
                  )

              # ---------------------------------------------------
              # Bonus skills
              # ---------------------------------------------------

              bonus_matches = [
                  skill
                  for skill in bonus
                  if skill in text
              ]

              bonus_points = min(
                  len(bonus_matches) * 1,
                  5
              )

              score += bonus_points

              if bonus_matches:
                  reasons.append(
                      "Bonus skills: "
                      + ", ".join(
                          bonus_matches[:5]
                      )
                  )

              # ---------------------------------------------------
              # Experience
              # ---------------------------------------------------

              exp_points, exp_penalty, exp_reason = experience_score(
                  text
              )

              score += exp_points
              score -= exp_penalty

              reasons.append(
                  exp_reason
              )

              # ---------------------------------------------------
              # Location
              # ---------------------------------------------------

              location_points, location_reason = location_score(
                  location
              )

              score += location_points

              reasons.append(
                  location_reason
              )

              # ---------------------------------------------------
              # Avoid list
              # ---------------------------------------------------

              matched_avoid = [
                  term
                  for term in avoid
                  if term in title_lower
              ]

              if matched_avoid:
                  score -= 30

                  reasons.append(
                      "Avoid/mismatch: "
                      + ", ".join(
                          matched_avoid[:3]
                      )
                  )

              # ---------------------------------------------------
              # Final score
              # ---------------------------------------------------

              final_score = max(
                  0,
                  min(
                      round(score),
                      100
                  )
              )

              return (
                  final_score,
                  reasons
              )

          # ---------------------------------------------------------
          # Rank jobs
          # ---------------------------------------------------------

          ranked = []

          for job in data.get(
              "results",
              []
          ):
              score, reasons = score_job(
                  job
              )

              ranked.append({
                  "score": score,
                  "title": job.get(
                      "title",
                      ""
                  ),
                  "company": job.get(
                      "company",
                      ""
                  ),
                  "location": job.get(
                      "location",
                      ""
                  ),
                  "date": job.get(
                      "date",
                      ""
                  ),
                  "url": job.get(
                      "url",
                      ""
                  ),
                  "job_id": job.get(
                      "id",
                      ""
                  ),
                  "reasons": reasons,
              })

          ranked.sort(
              key=lambda x: x["score"],
              reverse=True,
          )

          # ---------------------------------------------------------
          # Create report
          # ---------------------------------------------------------

          report = [
              f"# Daily Job Report — {date.today()}",
              "",
              f"**Jobs found:** {len(ranked)}",
              "",
              "## 🔥 Top Matches",
              "",
          ]

          for i, job in enumerate(
              ranked[:50],
              1
          ):
              report.extend([
                  f"### {i}. {job['title']}",
                  (
                      f"**{job['company']}** — "
                      f"{job['location']}"
                  ),
                  (
                      f"**Match score: "
                      f"{job['score']}/100**"
                  ),
                  "",
                  "**Why:** "
                  + (
                      "; ".join(
                          job["reasons"]
                      )
                      if job["reasons"]
                      else
                      "Limited information available"
                  ),
                  "",
                  f"**Apply:** {job['url']}",
                  "",
              ])

          Path(
              "jobs/daily-report.md"
          ).write_text(
              "\n".join(report)
          )

          Path(
              "jobs/ranked.json"
          ).write_text(
              json.dumps(
                  ranked,
                  indent=2
              )
          )

          print(
              "\n".join(report)
          )
          PY

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-results
          path: jobs/
          retention-days: 30
