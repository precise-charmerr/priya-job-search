name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search Pune
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Pune, Maharashtra, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/pune.json

      - name: Search Gurugram
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Gurugram, Haryana, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/gurugram.json

      - name: Search Noida
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Noida, Uttar Pradesh, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/noida.json

      - name: Search Bengaluru
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Bengaluru, Karnataka, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/bengaluru.json

      - name: Search Hyderabad
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Hyderabad, Telangana, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/hyderabad.json

      - name: Combine results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("*.json"):
              if file.name == "all.json":
                  continue

              data = json.loads(file.read_text())

              for job in data.get("results", []):
                  job_id = job.get("id")

                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-results
          path: jobs/
          retention-days: 30
