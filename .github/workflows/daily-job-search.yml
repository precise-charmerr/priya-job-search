name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      # Search 5 relevant Java/backend query variants across 6 target locations.
      # 5 x 6 x 8 = 240 maximum raw results before deduplication.
      # Deduplication below should normally leave roughly 100-200 unique jobs.
      - name: Search jobs across locations and queries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          queries = [
              "Java Backend Developer",
              "Java Developer Spring Boot",
              "Java Microservices",
              "Spring Boot Backend",
              "Java Software Engineer",
          ]

          locations = [
              ("pune", "Pune, Maharashtra, India"),
              ("gurugram", "Gurugram, Haryana, India"),
              ("noida", "Noida, Uttar Pradesh, India"),
              ("bengaluru", "Bengaluru, Karnataka, India"),
              ("hyderabad", "Hyderabad, Telangana, India"),
              ("remote", "Remote India"),
          ]

          total = 0

          for location_key, location in locations:
              for query_index, query in enumerate(queries, 1):
                  output_file = Path(
                      f"jobs/search-{location_key}-{query_index}.json"
                  )

                  print(
                      f"Searching: {query} | {location}"
                  )

                  try:
                      result = subprocess.run(
                          [
                              "bun",
                              "run",
                              ".agents/skills/linkedin-search/cli/src/cli.ts",
                              "search",
                              "--query",
                              query,
                              "--location",
                              location,
                              "--jobage",
                              "7",
                              "--limit",
                              "8",
                              "--format",
                              "json",
                          ],
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )

                      if result.returncode == 0:
                          output_file.write_text(result.stdout)
                          total += 1
                      else:
                          print(
                              f"Search failed for {query} | {location}: "
                              f"{result.stderr[:500]}"
                          )
                  except Exception as exc:
                      print(
                          f"Search error for {query} | {location}: {exc}"
                      )

          print(f"Successful searches: {total}/30")
          PY

      - name: Combine and deduplicate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("search-*.json"):
              try:
                  data = json.loads(file.read_text())
              except Exception as exc:
                  print(f"Skipping invalid {file}: {exc}")
                  continue

              for job in data.get("results", []):
                  job_id = job.get("id")
                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs,
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Fetch job details
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import time

          data = json.loads(Path("jobs/all.json").read_text())
          detailed = []
          results = data.get("results", [])

          for i, job in enumerate(results, 1):
              job_id = job["id"]

              print(
                  f"[{i}/{len(results)}] "
                  f"Fetching {job_id} - {job['title']}"
              )

              try:
                  result = subprocess.run(
                      [
                          "bun",
                          "run",
                          ".agents/skills/linkedin-search/cli/src/cli.ts",
                          "detail",
                          job_id,
                          "--format",
                          "json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  if result.returncode == 0:
                      detail = json.loads(result.stdout)

                      if isinstance(detail, dict):
                          job.update(detail)
                  else:
                      print(
                          f"Detail fetch failed for {job_id}: "
                          f"{result.stderr[:300]}"
                      )

                  detailed.append(job)

              except Exception as exc:
                  print(f"Error fetching {job_id}: {exc}")
                  detailed.append(job)

              time.sleep(1)

          Path("jobs/detailed.json").write_text(
              json.dumps(
                  {
                      "count": len(detailed),
                      "results": detailed,
                  },
                  indent=2,
              )
          )

          print(f"Detailed jobs collected: {len(detailed)}")
          PY

            - name: Create ranked report
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import date

          profile = json.loads(
              Path("config/job-profile.json").read_text()
          )

          data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          target_roles = [
              x.lower() for x in profile.get("target_roles", [])
          ]

          core = [
              x.lower() for x in profile.get("core_skills", [])
          ]

          secondary = [
              x.lower() for x in profile.get("secondary_skills", [])
          ]

          experience_years = float(
              profile.get("experience_years", 0)
          )

          priority_1 = [
              x.lower()
              for x in profile["locations"].get("priority_1", [])
          ]

          priority_2 = [
              x.lower()
              for x in profile["locations"].get("priority_2", [])
          ]

          priority_3 = [
              x.lower()
              for x in profile["locations"].get("priority_3", [])
          ]

          avoid = [
              x.lower()
              for x in profile.get("avoid_or_low_priority", [])
          ]

          # ------------------------------------------------------------
          # Experience extraction
          # ------------------------------------------------------------

          def extract_experience_range(text):
              patterns = [
                  r'(\d+(?:\.\d+)?)\s*(?:-|–|—|to)\s*(\d+(?:\.\d+)?)\s*(?:\+)?\s*(?:years?|yrs?)',
                  r'(\d+(?:\.\d+)?)\s*\+\s*(?:years?|yrs?)',
                  r'(\d+(?:\.\d+)?)\s*(?:years?|yrs?)',
              ]

              for pattern in patterns:
                  match = re.search(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  )

                  if not match:
                      continue

                  if match.lastindex == 2:
                      low = float(match.group(1))
                      high = float(match.group(2))
                      return low, high

                  low = float(match.group(1))

                  if "+" in match.group(0):
                      return low, None

                  return low, low

              return None

          def experience_score(text):
              result = extract_experience_range(text)

              if result is None:
                  return 0, "Experience requirement not stated"

              minimum, maximum = result

              # 3 years is the target experience.
              # Reward roles that naturally include the user's experience.
              if maximum is None:
                  if experience_years >= minimum:
                      return 10, (
                          f"Experience: {minimum:g}+ years "
                          "(strong fit)"
                      )

                  gap = minimum - experience_years

                  if gap <= 1:
                      return 3, (
                          f"Experience: {minimum:g}+ years "
                          "(slight stretch)"
                      )

                  if gap <= 2:
                      return -5, (
                          f"Experience: {minimum:g}+ years "
                          "(stretch)"
                      )

                  return -15, (
                      f"Experience: {minimum:g}+ years "
                      "(major stretch)"
                  )

              # User's experience falls inside the requested range.
              if minimum <= experience_years <= maximum:
                  return 12, (
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(strong fit)"
                  )

              # Job asks for slightly more experience.
              if experience_years < minimum:
                  gap = minimum - experience_years

                  if gap <= 1:
                      return 4, (
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(slight stretch)"
                      )

                  if gap <= 2:
                      return -4, (
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(stretch)"
                      )

                  return -15, (
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(major stretch)"
                  )

              # Job's range is below the user's experience.
              return 8, (
                  f"Experience: {minimum:g}–{maximum:g} years "
                  "(meets/exceeds)"
              )

          # ------------------------------------------------------------
          # Role classification
          # ------------------------------------------------------------

          strong_backend_titles = [
              "java backend",
              "java developer",
              "java engineer",
              "spring boot",
              "backend engineer",
              "backend developer",
              "software engineer",
              "software developer",
              "microservices engineer",
          ]

          seniority_penalties = [
              ("architect", -15),
              ("principal", -12),
              ("staff engineer", -10),
              ("lead", -8),
              ("technical lead", -8),
              ("vice president", -15),
              ("vp", -15),
              ("director", -20),
              ("head of", -20),
          ]

          def classify_role(title):
              title_lower = title.lower()

              # Strongly preferred backend roles.
              if any(
                  term in title_lower
                  for term in [
                      "java backend",
                      "backend engineer",
                      "backend developer",
                      "java developer",
                      "java engineer",
                      "spring boot",
                      "microservices engineer",
                  ]
              ):
                  return "backend"

              # Generic software engineering role.
              if any(
                  term in title_lower
                  for term in [
                      "software engineer",
                      "software developer",
                  ]
              ):
                  return "software"

              # Fullstack is acceptable but lower priority.
              if "fullstack" in title_lower or "full stack" in title_lower:
                  return "fullstack"

              return "other"

          # ------------------------------------------------------------
          # Score jobs
          # ------------------------------------------------------------

          def score_job(job):
              title = job.get("title", "") or ""
              description = job.get("description", "") or ""
              location = job.get("location", "") or ""

              title_lower = title.lower()
              location_lower = location.lower()

              text = f"{title} {description}".lower()

              score = 0
              reasons = []

              # --------------------------------------------------------
              # Core technical skills
              # --------------------------------------------------------

              core_matches = [
                  skill
                  for skill in core
                  if skill in text
              ]

              # Cap core skills so keyword-heavy descriptions
              # don't completely dominate the ranking.
              score += min(len(core_matches) * 4, 32)

              if core_matches:
                  reasons.append(
                      "Core skills: "
                      + ", ".join(core_matches[:7])
                  )

              # --------------------------------------------------------
              # Secondary / AI skills
              # --------------------------------------------------------

              secondary_matches = [
                  skill
                  for skill in secondary
                  if skill in text
              ]

              # AI/RAG/etc. is a bonus, not the main ranking factor.
              score += min(len(secondary_matches) * 1.5, 8)

              if secondary_matches:
                  reasons.append(
                      "Additional skills: "
                      + ", ".join(secondary_matches[:5])
                  )

              # --------------------------------------------------------
              # Role fit
              # --------------------------------------------------------

              role_type = classify_role(title)

              if role_type == "backend":
                  score += 22
                  reasons.append("Strong backend role")

              elif role_type == "software":
                  score += 16
                  reasons.append("Target software-engineering role")

              elif role_type == "fullstack":
                  score += 8
                  reasons.append("Fullstack role")

              else:
                  # Generic/non-target role.
                  score += 2

              # Exact target-role title match gets a small additional
              # bonus without overpowering experience/location.
              role_matches = [
                  role
                  for role in target_roles
                  if role in title_lower
              ]

              if role_matches:
                  score += 5

              # --------------------------------------------------------
              # Experience
              # --------------------------------------------------------

              exp_points, exp_reason = experience_score(text)
              score += exp_points
              reasons.append(exp_reason)

              # --------------------------------------------------------
              # Location
              # --------------------------------------------------------

              if any(
                  x in location_lower
                  for x in priority_1
              ):
                  score += 20
                  reasons.append("Priority location")

              elif any(
                  x in location_lower
                  for x in priority_2
              ):
                  score += 12
                  reasons.append("Preferred location")

              elif any(
                  x in location_lower
                  for x in priority_3
              ):
                  score += 7
                  reasons.append("Secondary location")

              # --------------------------------------------------------
              # Seniority penalties
              # --------------------------------------------------------

              for term, penalty in seniority_penalties:
                  if term in title_lower:
                      score += penalty
                      reasons.append(
                          f"Seniority adjustment: {term}"
                      )
                      break

              # --------------------------------------------------------
              # Explicitly unwanted roles
              # --------------------------------------------------------

              matched_avoid = [
                  term
                  for term in avoid
                  if term in title_lower
              ]

              if matched_avoid:
                  score -= 30
                  reasons.append(
                      "Low-priority role: "
                      + ", ".join(matched_avoid[:3])
                  )

              # --------------------------------------------------------
              # Additional title-level penalties
              # --------------------------------------------------------

              if "frontend" in title_lower:
                  score -= 30
                  reasons.append("Frontend role")

              if "ui developer" in title_lower:
                  score -= 30
                  reasons.append("UI role")

              if "web designer" in title_lower:
                  score -= 35
                  reasons.append("Design role")

              if "manual tester" in title_lower:
                  score -= 35
                  reasons.append("Testing role")

              if "qa tester" in title_lower:
                  score -= 35
                  reasons.append("Testing role")

              if "devops engineer" in title_lower:
                  score -= 25
                  reasons.append("DevOps role")

              # --------------------------------------------------------
              # Final score
              # --------------------------------------------------------

              final_score = max(
                  0,
                  min(round(score), 100)
              )

              # --------------------------------------------------------
              # Bucket
              # --------------------------------------------------------

              # High priority requires both a good score and a sensible
              # role/experience combination.
              if (
                  final_score >= 70
                  and role_type in ("backend", "software")
                  and not any(
                      term in title_lower
                      for term in [
                          "architect",
                          "principal",
                          "director",
                          "vice president",
                          "vp",
                      ]
                  )
              ):
                  bucket = "🔥 HIGH PRIORITY"

              elif final_score >= 58:
                  bucket = "🟢 GOOD MATCH"

              elif final_score >= 45:
                  bucket = "🟡 STRETCH"

              else:
                  bucket = "🔴 LOW PRIORITY"

              return {
                  "score": final_score,
                  "bucket": bucket,
                  "title": title,
                  "company": job.get("company", ""),
                  "location": location,
                  "date": job.get("date", ""),
                  "url": job.get("url", ""),
                  "job_id": job.get("id", ""),
                  "reasons": reasons,
              }

          # ------------------------------------------------------------
          # Rank everything
          # ------------------------------------------------------------

          ranked = []

          for job in data.get("results", []):
              ranked.append(score_job(job))

          # Bucket order first, then score.
          bucket_order = {
              "🔥 HIGH PRIORITY": 0,
              "🟢 GOOD MATCH": 1,
              "🟡 STRETCH": 2,
              "🔴 LOW PRIORITY": 3,
          }

          ranked.sort(
              key=lambda x: (
                  bucket_order.get(x["bucket"], 9),
                  -x["score"],
              )
          )

          # ------------------------------------------------------------
          # Create report
          # ------------------------------------------------------------

          report = [
              f"# Daily Job Report — {date.today()}",
              "",
              f"**Jobs found:** {len(ranked)}",
              "",
              "**Priority:** Pune / Gurugram / Noida → "
              "Bengaluru / Hyderabad → Other / Remote",
              "",
              "**Experience target:** 3 years",
              "",
          ]

          bucket_descriptions = {
              "🔥 HIGH PRIORITY": (
                  "Strong Java/backend fit with good experience and/or "
                  "priority location. **Apply first.**"
              ),
              "🟢 GOOD MATCH": (
                  "Good overall fit. **Apply after High Priority jobs.**"
              ),
              "🟡 STRETCH": (
                  "Potentially useful, but has a meaningful "
                  "experience/role/location stretch."
              ),
              "🔴 LOW PRIORITY": (
                  "Weak fit, excessive seniority, or unwanted role. "
                  "**Usually skip.**"
              ),
          }

          for bucket in [
              "🔥 HIGH PRIORITY",
              "🟢 GOOD MATCH",
              "🟡 STRETCH",
              "🔴 LOW PRIORITY",
          ]:
              bucket_jobs = [
                  job
                  for job in ranked
                  if job["bucket"] == bucket
              ]

              report.extend([
                  f"## {bucket}",
                  "",
                  bucket_descriptions[bucket],
                  "",
                  f"**Jobs in this bucket:** {len(bucket_jobs)}",
                  "",
              ])

              for index, job in enumerate(bucket_jobs, 1):
                  report.extend([
                      f"### {index}. {job['title']}",
                      (
                          f"**{job['company']}** — "
                          f"{job['location']}"
                      ),
                      (
                          f"**Match score: "
                          f"{job['score']}/100**"
                      ),
                      "",
                      "**Why:** "
                      + (
                          "; ".join(job["reasons"])
                          if job["reasons"]
                          else "Limited information available"
                      ),
                      "",
                      f"**Apply:** {job['url']}",
                      "",
                  ])

          Path("jobs/daily-report.md").write_text(
              "\n".join(report)
          )

          Path("jobs/ranked.json").write_text(
              json.dumps(ranked, indent=2)
          )

          print("\n".join(report))
          PY

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-results
          path: jobs/
          retention-days: 30
