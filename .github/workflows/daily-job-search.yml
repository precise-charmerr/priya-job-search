name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search jobs across locations and queries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          queries = [
              "Java Backend Developer",
              "Java Developer Spring Boot",
              "Java Microservices",
              "Spring Boot Backend",
              "Java Software Engineer",
          ]

          locations = [
              ("pune", "Pune, Maharashtra, India"),
              ("gurugram", "Gurugram, Haryana, India"),
              ("noida", "Noida, Uttar Pradesh, India"),
              ("bengaluru", "Bengaluru, Karnataka, India"),
              ("hyderabad", "Hyderabad, Telangana, India"),
              ("remote", "Remote India"),
          ]

          total = 0

          for location_key, location in locations:
              for query_index, query in enumerate(queries, 1):
                  output_file = Path(
                      f"jobs/search-{location_key}-{query_index}.json"
                  )

                  print(f"Searching: {query} | {location}")

                  try:
                      result = subprocess.run(
                          [
                              "bun",
                              "run",
                              ".agents/skills/linkedin-search/cli/src/cli.ts",
                              "search",
                              "--query",
                              query,
                              "--location",
                              location,
                              "--jobage",
                              "7",
                              "--limit",
                              "8",
                              "--format",
                              "json",
                          ],
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )

                      if result.returncode == 0:
                          output_file.write_text(result.stdout)
                          total += 1
                      else:
                          print(
                              f"Search failed for {query} | {location}: "
                              f"{result.stderr[:500]}"
                          )

                  except Exception as exc:
                      print(
                          f"Search error for {query} | {location}: {exc}"
                      )

          print(f"Successful searches: {total}/30")
          PY

      - name: Combine and deduplicate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("search-*.json"):
              try:
                  data = json.loads(file.read_text())
              except Exception as exc:
                  print(f"Skipping invalid {file}: {exc}")
                  continue

              for job in data.get("results", []):
                  job_id = job.get("id")

                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs,
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Fetch job details
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          data = json.loads(
              Path("jobs/all.json").read_text()
          )

          detailed = []
          results = data.get("results", [])

          for i, job in enumerate(results, 1):
              job_id = job["id"]

              print(
                  f"[{i}/{len(results)}] "
                  f"Fetching {job_id} - {job['title']}"
              )

              try:
                  result = subprocess.run(
                      [
                          "bun",
                          "run",
                          ".agents/skills/linkedin-search/cli/src/cli.ts",
                          "detail",
                          job_id,
                          "--format",
                          "json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  if result.returncode == 0:
                      detail = json.loads(result.stdout)

                      if isinstance(detail, dict):
                          job.update(detail)

                  else:
                      print(
                          f"Detail fetch failed for {job_id}: "
                          f"{result.stderr[:300]}"
                      )

                  detailed.append(job)

              except Exception as exc:
                  print(
                      f"Error fetching {job_id}: {exc}"
                  )
                  detailed.append(job)

              time.sleep(1)

          Path("jobs/detailed.json").write_text(
              json.dumps(
                  {
                      "count": len(detailed),
                      "results": detailed,
                  },
                  indent=2,
              )
          )

          print(
              f"Detailed jobs collected: {len(detailed)}"
          )
          PY

      - name: Create ranked report
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          profile = json.loads(
              Path("config/job-profile.json").read_text()
          )

          data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          target_roles = [
              x.lower()
              for x in profile.get("target_roles", [])
          ]

          core = [
              x.lower()
              for x in profile.get("core_skills", [])
          ]

          secondary = [
              x.lower()
              for x in profile.get("secondary_skills", [])
          ]

          experience_years = float(
              profile.get("experience_years", 0)
          )

          priority_1 = [
              x.lower()
              for x in profile["locations"].get(
                  "priority_1",
                  []
              )
          ]

          priority_2 = [
              x.lower()
              for x in profile["locations"].get(
                  "priority_2",
                  []
              )
          ]

          priority_3 = [
              x.lower()
              for x in profile["locations"].get(
                  "priority_3",
                  []
              )
          ]

          avoid = [
              x.lower()
              for x in profile.get(
                  "avoid_or_low_priority",
                  []
              )
          ]

          def extract_experience_range(text):
              """
              Extract a realistic experience requirement.

              Examples:
              3-5 years
              3 to 5 years
              3+ years
              3 years of experience

              Unrealistic values such as 100+ years are ignored.
              """

              patterns = [
                  # 3-5 years / 3 to 5 years
                  r'(\d+(?:\.\d+)?)\s*(?:-|–|—|to)\s*'
                  r'(\d+(?:\.\d+)?)\s*(?:years?|yrs?)',

                  # 3+ years
                  r'(\d+(?:\.\d+)?)\s*\+\s*'
                  r'(?:years?|yrs?)',

                  # 3 years of experience
                  r'(\d+(?:\.\d+)?)\s*'
                  r'(?:years?|yrs?)\s+'
                  r'(?:of\s+)?'
                  r'(?:relevant\s+)?'
                  r'(?:work\s+)?experience',
              ]

              candidates = []

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  ):
                      if match.lastindex >= 2:
                          low = float(match.group(1))
                          high = float(match.group(2))
                      else:
                          low = float(match.group(1))

                          if "+" in match.group(0):
                              high = None
                          else:
                              high = low

                      # Ignore obviously invalid values.
                      if low > 15:
                          continue

                      if high is not None and high > 15:
                          continue

                      candidates.append(
                          (low, high)
                      )

              if not candidates:
                  return None

              return candidates[0]

          def experience_score(text):
              result = extract_experience_range(text)

              if result is None:
                  return (
                      0,
                      "Experience requirement not stated"
                  )

              minimum, maximum = result

              # Example: 3+ years
              if maximum is None:

                  if experience_years >= minimum:
                      return (
                          10,
                          f"Experience: {minimum:g}+ years "
                          "(meets)"
                      )

                  gap = minimum - experience_years

                  if gap <= 1:
                      return (
                          4,
                          f"Experience: {minimum:g}+ years "
                          "(slight stretch)"
                      )

                  if gap <= 2:
                      return (
                          -6,
                          f"Experience: {minimum:g}+ years "
                          "(stretch)"
                      )

                  return (
                      -18,
                      f"Experience: {minimum:g}+ years "
                      "(mismatch)"
                  )

              # Candidate is inside requested range.
              if minimum <= experience_years <= maximum:
                  return (
                      10,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(strong fit)"
                  )

              # Candidate has less experience than required.
              if experience_years < minimum:
                  gap = minimum - experience_years

                  if gap <= 1:
                      return (
                          4,
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(slight stretch)"
                      )

                  if gap <= 2:
                      return (
                          -6,
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(stretch)"
                      )

                  return (
                      -18,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(mismatch)"
                  )

              # Candidate has more experience than requested.
              return (
                  8,
                  f"Experience: {minimum:g}–{maximum:g} years "
                  "(meets/exceeds)"
              )

          def score_job(job):
              title = job.get("title", "")
              description = job.get("description", "") or ""
              location = job.get("location", "") or ""

              text = f"{title} {description}".lower()
              title_lower = title.lower()
              location_lower = location.lower()

              score = 0
              reasons = []

              core_matches = [
                  skill
                  for skill in core
                  if skill in text
              ]

              score += min(
                  len(core_matches) * 5,
                  40
              )

              if core_matches:
                  reasons.append(
                      "Core skills: "
                      + ", ".join(core_matches[:7])
                  )

              secondary_matches = [
                  skill
                  for skill in secondary
                  if skill in text
              ]

              score += min(
                  len(secondary_matches) * 1.5,
                  8
              )

              if secondary_matches:
                  reasons.append(
                      "Additional skills: "
                      + ", ".join(
                          secondary_matches[:5]
                      )
                  )

              role_matches = [
                  role
                  for role in target_roles
                  if role in title_lower
              ]

              backend_terms = [
                  "backend",
                  "back end",
                  "java developer",
                  "java engineer",
                  "spring boot",
                  "microservices",
              ]

              backend_matches = [
                  term
                  for term in backend_terms
                  if term in title_lower
              ]

              if role_matches:
                  score += 17
                  reasons.append("Target role")

              elif backend_matches:
                  score += 12
                  reasons.append(
                      "Strong backend role"
                  )

              exp_points, exp_reason = experience_score(
                  text
              )

              score += exp_points
              reasons.append(exp_reason)

              if any(
                  x in location_lower
                  for x in priority_1
              ):
                  score += 15
                  reasons.append(
                      "Priority location"
                  )

              elif any(
                  x in location_lower
                  for x in priority_2
              ):
                  score += 10
                  reasons.append(
                      "Preferred location"
                  )

              elif (
                  "remote" in location_lower
                  and any(
                      "remote" in x
                      for x in priority_3
                  )
              ):
                  score += 7
                  reasons.append(
                      "Remote option"
                  )

              matched_avoid = [
                  term
                  for term in avoid
                  if term in title_lower
              ]

              if matched_avoid:
                  score -= 25
                  reasons.append(
                      "Possible role mismatch: "
                      + ", ".join(
                          matched_avoid[:3]
                      )
                  )

              return (
                  max(
                      0,
                      min(
                          round(score),
                          100
                      )
                  ),
                  reasons,
              )

          ranked = []

          for job in data.get("results", []):
              score, reasons = score_job(job)

              ranked.append({
                  "score": score,
                  "title": job.get(
                      "title",
                      ""
                  ),
                  "company": job.get(
                      "company",
                      ""
                  ),
                  "location": job.get(
                      "location",
                      ""
                  ),
                  "date": job.get(
                      "date",
                      ""
                  ),
                  "url": job.get(
                      "url",
                      ""
                  ),
                  "job_id": job.get(
                      "id",
                      ""
                  ),
                  "reasons": reasons,
              })

          ranked.sort(
              key=lambda x: x["score"],
              reverse=True,
          )

          report = [
              f"# Daily Job Report — {date.today()}",
              "",
              f"**Jobs found:** {len(ranked)}",
              "",
              "## 🔥 Top Matches",
              "",
          ]

          for i, job in enumerate(
              ranked[:50],
              1
          ):
              report.extend([
                  f"### {i}. {job['title']}",
                  (
                      f"**{job['company']}** — "
                      f"{job['location']}"
                  ),
                  (
                      f"**Match score: "
                      f"{job['score']}/100**"
                  ),
                  "",
                  "**Why:** "
                  + (
                      "; ".join(
                          job["reasons"]
                      )
                      if job["reasons"]
                      else
                      "Limited information available"
                  ),
                  "",
                  f"**Apply:** {job['url']}",
                  "",
              ])

          Path(
              "jobs/daily-report.md"
          ).write_text(
              "\n".join(report)
          )

          Path(
              "jobs/ranked.json"
          ).write_text(
              json.dumps(
                  ranked,
                  indent=2
              )
          )

          print("\n".join(report))
          PY

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-results
          path: jobs/
          retention-days: 30
