name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search jobs across locations and queries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          cli = ".agents/skills/linkedin-search/cli/src/cli.ts"

          queries = [
              "Java Backend Developer",
              "Java Developer Spring Boot",
              "Java Microservices",
              "Spring Boot Backend",
              "Java Software Engineer",
          ]

          locations = [
              ("pune", "Pune, Maharashtra, India"),
              ("gurugram", "Gurugram, Haryana, India"),
              ("noida", "Noida, Uttar Pradesh, India"),
              ("bengaluru", "Bengaluru, Karnataka, India"),
              ("hyderabad", "Hyderabad, Telangana, India"),
              ("remote", "Remote India"),
          ]

          total = 0

          for location_key, location in locations:
              for query_index, query in enumerate(queries, 1):
                  output_file = Path(
                      f"jobs/search-{location_key}-{query_index}.json"
                  )

                  print(f"Searching: {query} | {location}")

                  try:
                      result = subprocess.run(
                          [
                              "bun",
                              "run",
                              cli,
                              "search",
                              "--query",
                              query,
                              "--location",
                              location,
                              "--jobage",
                              "7",
                              "--limit",
                              "8",
                              "--format",
                              "json",
                          ],
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )

                      if result.returncode == 0:
                          output_file.write_text(result.stdout)
                          total += 1
                      else:
                          print(
                              f"Search failed for {query} | {location}: "
                              f"{result.stderr[:500]}"
                          )

                  except Exception as exc:
                      print(
                          f"Search error for {query} | {location}: {exc}"
                      )

          print(f"Successful searches: {total}/30")
          PY

      - name: Combine and deduplicate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("search-*.json"):
              try:
                  data = json.loads(file.read_text())
              except Exception as exc:
                  print(f"Skipping invalid {file}: {exc}")
                  continue

              for job in data.get("results", []):
                  job_id = job.get("id")

                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs,
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Fetch job details
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          cli = ".agents/skills/linkedin-search/cli/src/cli.ts"

          data = json.loads(
              Path("jobs/all.json").read_text()
          )

          detailed = []
          results = data.get("results", [])

          for i, job in enumerate(results, 1):
              job_id = job["id"]

              print(
                  f"[{i}/{len(results)}] "
                  f"Fetching {job_id} - {job.get('title', '')}"
              )

              try:
                  result = subprocess.run(
                      [
                          "bun",
                          "run",
                          cli,
                          "detail",
                          job_id,
                          "--format",
                          "json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  if result.returncode == 0:
                      detail = json.loads(result.stdout)

                      if isinstance(detail, dict):
                          job.update(detail)

                  else:
                      print(
                          f"Detail fetch failed for {job_id}: "
                          f"{result.stderr[:300]}"
                      )

                  detailed.append(job)

              except Exception as exc:
                  print(
                      f"Error fetching {job_id}: {exc}"
                  )
                  detailed.append(job)

              time.sleep(1)

          Path("jobs/detailed.json").write_text(
              json.dumps(
                  {
                      "count": len(detailed),
                      "results": detailed,
                  },
                  indent=2,
              )
          )

          print(
              f"Detailed jobs collected: {len(detailed)}"
          )
          PY

      - name: Create ranked report
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          profile = json.loads(
              Path("config/job-profile.json").read_text()
          )

          data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          target_roles = profile.get(
              "target_roles",
              {}
          )

          primary_roles = [
              x.lower()
              for x in target_roles.get("primary", [])
          ]

          secondary_roles = [
              x.lower()
              for x in target_roles.get("secondary", [])
          ]

          experience = profile.get(
              "experience",
              {}
          )

          current_years = float(
              experience.get("current_years", 0)
          )

          minimum_years = float(
              experience.get("minimum_years", 0)
          )

          ideal_minimum_years = float(
              experience.get("ideal_minimum_years", 0)
          )

          ideal_maximum_years = float(
              experience.get("ideal_maximum_years", 0)
          )

          maximum_years = float(
              experience.get("maximum_years", 0)
          )

          skills = profile.get(
              "skills",
              {}
          )

          must_have = [
              x.lower()
              for x in skills.get("must_have", [])
          ]

          high_value = [
              x.lower()
              for x in skills.get("high_value", [])
          ]

          supporting = [
              x.lower()
              for x in skills.get("supporting", [])
          ]

          bonus = [
              x.lower()
              for x in skills.get("bonus", [])
          ]

          locations = {
              k.lower(): float(v)
              for k, v in profile.get(
                  "locations",
                  {}
              ).items()
          }

          avoid = [
              x.lower()
              for x in profile.get("avoid", [])
          ]

          daily_target = int(
              profile.get("daily_target", 50)
          )

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "").lower()
              ).strip()

          def job_text(job):
              return " ".join(
                  [
                      str(job.get("title", "")),
                      str(job.get("description", "")),
                      str(job.get("requirements", "")),
                      str(job.get("experience", "")),
                  ]
              )

          def extract_experience_range(text):
              patterns = [
                  (
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:-|–|—|to)\s*"
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:\+)?\s*(?:years?|yrs?)"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*\+\s*"
                      r"(?:years?|yrs?)"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:years?|yrs?)"
                  ),
              ]

              ranges = []

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  ):
                      if match.lastindex == 2:
                          low = float(match.group(1))
                          high = float(match.group(2))

                          ranges.append(
                              (low, high, False)
                          )
                      else:
                          low = float(match.group(1))

                          if "+" in match.group(0):
                              ranges.append(
                                  (low, None, True)
                              )
                          else:
                              ranges.append(
                                  (low, low, False)
                              )

              if not ranges:
                  return None

              return ranges[0]

          def experience_score(text):
              result = extract_experience_range(text)

              if result is None:
                  return (
                      0,
                      0,
                      "Experience: not stated"
                  )

              minimum, maximum, open_ended = result

              # =====================================================
              # OPEN-ENDED: "X+ years"
              # =====================================================

              if open_ended:

                  if minimum > maximum_years:
                      return (
                          0,
                          -20,
                          f"Experience: {minimum:g}+ years "
                          "(mismatch)"
                      )

                  if minimum > current_years:
                      gap = minimum - current_years

                      if gap >= 2:
                          return (
                              4,
                              -10,
                              f"Experience: {minimum:g}+ years "
                              "(significant stretch)"
                          )

                      return (
                          6,
                          -5,
                          f"Experience: {minimum:g}+ years "
                          "(slight stretch)"
                      )

                  if minimum >= ideal_minimum_years:
                      return (
                          10,
                          0,
                          f"Experience: {minimum:g}+ years "
                          "(ideal fit)"
                      )

                  return (
                      5,
                      0,
                      f"Experience: {minimum:g}+ years "
                      "(below target)"
                  )

              # =====================================================
              # BOUNDED RANGE: "X-Y years"
              # =====================================================

              # First check if the upper bound is too high.
              excess = maximum - maximum_years

              if excess >= 4:
                  return (
                      0,
                      -20,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(mismatch)"
                  )

              if excess >= 2:
                  return (
                      4,
                      -10,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(significant stretch)"
                  )

              if excess > 0:
                  return (
                      6,
                      -5,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(slight stretch)"
                  )

              # -----------------------------------------------------
              # NEW FIX:
              #
              # If the entire range ends below the candidate's
              # ideal minimum, the job is below target.
              #
              # Example:
              # Candidate = 3 years
              # Job = 1-2 years
              #
              # 2 < ideal_minimum_years (3)
              # therefore -> below target.
              # -----------------------------------------------------

              if maximum < ideal_minimum_years:
                  return (
                      5,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(below target)"
                  )

              # Ideal range.
              if (
                  minimum >= ideal_minimum_years
                  and maximum <= ideal_maximum_years
              ):
                  return (
                      10,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(ideal fit)"
                  )

              # Acceptable range.
              if (
                  minimum >= minimum_years
                  and maximum <= maximum_years
              ):
                  return (
                      8,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(acceptable fit)"
                  )

              # Requirement starts above candidate's experience.
              if minimum > current_years:
                  gap = minimum - current_years

                  if gap >= 2:
                      return (
                          4,
                          -10,
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(significant stretch)"
                      )

                  return (
                      6,
                      -5,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(slight stretch)"
                  )

              return (
                  7,
                  0,
                  f"Experience: {minimum:g}–{maximum:g} years "
                  "(strong fit)"
              )

          def role_score(title):
              title = normalize(title)

              for role in primary_roles:
                  if role in title:
                      return (
                          20,
                          "Primary role"
                      )

              for role in secondary_roles:
                  if role in title:
                      return (
                          12,
                          "Secondary role"
                      )

              backend_terms = [
                  "backend",
                  "back end",
                  "java developer",
                  "java engineer",
                  "software engineer",
                  "software development engineer",
                  "application developer",
                  "platform engineer",
              ]

              if any(
                  term in title
                  for term in backend_terms
              ):
                  return (
                      8,
                      "Relevant backend role"
                  )

              return (
                  0,
                  ""
              )

          def skill_score(text):
              text = normalize(text)

              high_matches = [
                  skill
                  for skill in high_value
                  if skill in text
              ]

              supporting_matches = [
                  skill
                  for skill in supporting
                  if skill in text
              ]

              bonus_matches = [
                  skill
                  for skill in bonus
                  if skill in text
              ]

              score = (
                  min(
                      len(high_matches) * 4,
                      20
                  )
                  +
                  min(
                      len(supporting_matches) * 1.5,
                      10
                  )
                  +
                  min(
                      len(bonus_matches),
                      5
                  )
              )

              return (
                  score,
                  high_matches,
                  supporting_matches,
                  bonus_matches,
              )

          def location_score(location):
              location = normalize(location)

              best_location = None
              best_weight = 0

              for name, weight in locations.items():
                  if name in location:
                      if weight > best_weight:
                          best_location = name
                          best_weight = weight

              if best_location is None:
                  return (
                      0,
                      "Location: not prioritized"
                  )

              return (
                  min(
                      best_weight / 33.33,
                      3
                  ),
                  f"Location: {best_location.title()}"
              )

          def avoid_score(title):
              title = normalize(title)

              matches = [
                  term
                  for term in avoid
                  if term in title
              ]

              if not matches:
                  return (
                      0,
                      ""
                  )

              return (
                  -30,
                  "Avoid: " + ", ".join(matches[:3])
              )

          def score_job(job):

              title = job.get("title", "")
              location = job.get("location", "")

              text = job_text(job)

              must_matches = [
                  skill
                  for skill in must_have
                  if skill in normalize(text)
              ]

              if not must_matches:
                  return None

              score = 0
              reasons = []

              score += len(must_matches) * 20

              reasons.append(
                  "Must-have: "
                  + ", ".join(must_matches)
              )

              role_points, role_reason = role_score(
                  title
              )

              score += role_points

              if role_reason:
                  reasons.append(role_reason)

              (
                  skill_points,
                  high_matches,
                  supporting_matches,
                  bonus_matches,
              ) = skill_score(text)

              score += skill_points

              if high_matches:
                  reasons.append(
                      "High-value skills: "
                      + ", ".join(high_matches)
                  )

              if supporting_matches:
                  reasons.append(
                      "Supporting skills: "
                      + ", ".join(supporting_matches)
                  )

              if bonus_matches:
                  reasons.append(
                      "Bonus skills: "
                      + ", ".join(bonus_matches)
                  )

              (
                  experience_points,
                  experience_penalty,
                  experience_reason,
              ) = experience_score(text)

              score += experience_points
              score += experience_penalty

              reasons.append(
                  experience_reason
              )

              (
                  location_points,
                  location_reason,
              ) = location_score(location)

              score += location_points

              reasons.append(
                  location_reason
              )

              (
                  avoid_points,
                  avoid_reason,
              ) = avoid_score(title)

              score += avoid_points

              if avoid_reason:
                  reasons.append(
                      avoid_reason
                  )

              score = max(
                  0,
                  min(
                      round(score),
                      100
                  )
              )

              return {
                  "score": score,
                  "title": title,
                  "company": job.get(
                      "company",
                      ""
                  ),
                  "location": location,
                  "date": job.get(
                      "date",
                      ""
                  ),
                  "url": job.get(
                      "url",
                      ""
                  ),
                  "job_id": job.get(
                      "id",
                      ""
                  ),
                  "reasons": reasons,
              }

          ranked = []

          for job in data.get(
              "results",
              []
          ):
              scored = score_job(job)

              if scored:
                  ranked.append(scored)

          ranked.sort(
              key=lambda x: x["score"],
              reverse=True,
          )

          top_jobs = ranked[
              :daily_target
          ]

          report = [
              f"# Daily Job Report — {date.today()}",
              "",
              f"**Jobs found:** {len(ranked)}",
              "",
              "## 🔥 Top Matches",
              "",
          ]

          for i, job in enumerate(
              top_jobs,
              1
          ):
              report.extend(
                  [
                      f"### {i}. {job['title']}",
                      (
                          f"**{job['company']}** — "
                          f"{job['location']}"
                      ),
                      (
                          f"**Match score: "
                          f"{job['score']}/100**"
                      ),
                      "",
                      "**Why:** "
                      + "; ".join(
                          job["reasons"]
                      ),
                      "",
                      f"**Apply:** {job['url']}",
                      "",
                  ]
              )

          Path(
              "jobs/daily-report.md"
          ).write_text(
              "\n".join(report)
          )

          Path(
              "jobs/ranked.json"
          ).write_text(
              json.dumps(
                  ranked,
                  indent=2
              )
          )

          print(
              "\n".join(report)
          )
          PY

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-results
          path: jobs/
          retention-days: 30
