name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search Pune
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Pune, Maharashtra, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/pune.json

      - name: Search Gurugram
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Gurugram, Haryana, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/gurugram.json

      - name: Search Noida
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Noida, Uttar Pradesh, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/noida.json

      - name: Search Bengaluru
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Bengaluru, Karnataka, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/bengaluru.json

      - name: Search Hyderabad
        run: |
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Hyderabad, Telangana, India" \
            --jobage 7 \
            --limit 10 \
            --format json > jobs/hyderabad.json

      - name: Combine results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("*.json"):
              data = json.loads(file.read_text())

              for job in data.get("results", []):
                  job_id = job.get("id")

                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Fetch job details
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import time

          data = json.loads(Path("jobs/all.json").read_text())
          detailed = []

          results = data.get("results", [])

          for i, job in enumerate(results, 1):
              job_id = job["id"]

              print(
                  f"[{i}/{len(results)}] "
                  f"Fetching {job_id} - {job['title']}"
              )

              try:
                  result = subprocess.run(
                      [
                          "bun",
                          "run",
                          ".agents/skills/linkedin-search/cli/src/cli.ts",
                          "detail",
                          job_id,
                          "--format",
                          "json"
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30
                  )

                  if result.returncode == 0:
                      detail = json.loads(result.stdout)

                      if isinstance(detail, dict):
                          job.update(detail)

                  detailed.append(job)

              except Exception as e:
                  print(f"Error fetching {job_id}: {e}")
                  detailed.append(job)

              time.sleep(1)

          Path("jobs/detailed.json").write_text(
              json.dumps(
                  {
                      "count": len(detailed),
                      "results": detailed
                  },
                  indent=2
              )
          )

          print(f"Detailed jobs collected: {len(detailed)}")
          PY

      - name: Create ranked report
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import date

          profile = json.loads(
              Path("config/job-profile.json").read_text()
          )

          data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          # -----------------------------
          # Profile
          # -----------------------------
          target_roles = [
              x.lower() for x in profile.get("target_roles", [])
          ]

          core = [
              x.lower() for x in profile.get("core_skills", [])
          ]

          secondary = [
              x.lower() for x in profile.get("secondary_skills", [])
          ]

          experience_years = float(
              profile.get("experience_years", 0)
          )

          priority_1 = [
              x.lower()
              for x in profile["locations"].get("priority_1", [])
          ]

          priority_2 = [
              x.lower()
              for x in profile["locations"].get("priority_2", [])
          ]

          avoid = [
              x.lower()
              for x in profile.get("avoid_or_low_priority", [])
          ]

          # -----------------------------
          # Helpers
          # -----------------------------
          def extract_experience_range(text):
              """
              Returns (minimum_years, maximum_years_or_None)
              for common phrases such as:
                3 years
                3-5 years
                4–5 years
                5+ years
                5 to 7 years
              """
              patterns = [
                  r'(\d+(?:\.\d+)?)\s*(?:-|–|—|to)\s*(\d+(?:\.\d+)?)\s*(?:\+)?\s*(?:years?|yrs?)',
                  r'(\d+(?:\.\d+)?)\s*\+\s*(?:years?|yrs?)',
                  r'(\d+(?:\.\d+)?)\s*(?:years?|yrs?)'
              ]

              ranges = []

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE
                  ):
                      if match.lastindex == 2:
                          low = float(match.group(1))
                          high = float(match.group(2))
                          ranges.append((low, high))
                      else:
                          low = float(match.group(1))

                          # "5+" means at least 5.
                          if "+" in match.group(0):
                              ranges.append((low, None))
                          else:
                              # A standalone "3 years" is usually
                              # a requirement, not an exact range.
                              ranges.append((low, low))

              if not ranges:
                  return None

              # Prefer explicit ranges / 5+ over incidental numbers.
              for low, high in ranges:
                  if high is not None or "+" in text[
                      max(0, text.find(str(int(low))) - 5):
                      text.find(str(int(low))) + 20
                  ]:
                      return low, high

              return ranges[0]

          def experience_score(text):
              result = extract_experience_range(text)

              if result is None:
                  return 0, "Experience requirement not stated"

              minimum, maximum = result

              if maximum is None:
                  if experience_years >= minimum:
                      return 8, f"Experience: {minimum:g}+ years (meets)"
                  elif minimum - experience_years <= 1:
                      return 2, f"Experience: {minimum:g}+ years (slight stretch)"
                  elif minimum - experience_years <= 2:
                      return -8, f"Experience: {minimum:g}+ years (stretch)"
                  else:
                      return -18, f"Experience: {minimum:g}+ years (mismatch)"

              if minimum <= experience_years <= maximum:
                  return 10, (
                      f"Experience: {minimum:g}–{maximum:g} years (strong fit)"
                  )

              if experience_years < minimum:
                  gap = minimum - experience_years

                  if gap <= 1:
                      return 4, (
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(slight stretch)"
                      )
                  elif gap <= 2:
                      return -6, (
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(stretch)"
                      )
                  else:
                      return -18, (
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(mismatch)"
                      )

              # Candidate has more experience than requested.
              # This is normally not a serious problem.
              return 6, (
                  f"Experience: {minimum:g}–{maximum:g} years "
                  "(meets/exceeds)"
              )

          def score_job(job):
              title = job.get("title", "")
              description = job.get("description", "") or ""

              text = f"{title} {description}".lower()
              title_lower = title.lower()

              score = 0
              reasons = []

              # -----------------------------
              # 1. Core skills — maximum 40
              # -----------------------------
              core_matches = [
                  skill for skill in core
                  if skill in text
              ]

              score += min(len(core_matches) * 5, 40)

              if core_matches:
                  reasons.append(
                      "Core skills: "
                      + ", ".join(core_matches[:7])
                  )

              # -----------------------------
              # 2. Secondary skills — maximum 8
              # -----------------------------
              secondary_matches = [
                  skill for skill in secondary
                  if skill in text
              ]

              score += min(len(secondary_matches) * 1.5, 8)

              if secondary_matches:
                  reasons.append(
                      "Additional skills: "
                      + ", ".join(secondary_matches[:5])
                  )

              # -----------------------------
              # 3. Target role — maximum 17
              # -----------------------------
              role_matches = [
                  role for role in target_roles
                  if role in title_lower
              ]

              # Also recognize strong backend signals in the title.
              backend_terms = [
                  "backend",
                  "back end",
                  "java developer",
                  "java engineer",
                  "spring boot",
                  "microservices"
              ]

              backend_matches = [
                  term for term in backend_terms
                  if term in title_lower
              ]

              if role_matches:
                  score += 17
                  reasons.append("Target role")
              elif backend_matches:
                  score += 12
                  reasons.append("Strong backend role")

              # -----------------------------
              # 4. Experience — maximum 10
              # -----------------------------
              exp_points, exp_reason = experience_score(text)
              score += exp_points
              reasons.append(exp_reason)

              # -----------------------------
              # 5. Location — maximum 15
              # -----------------------------
              location = job.get("location", "").lower()

              if any(x in location for x in priority_1):
                  score += 15
                  reasons.append("Priority location")
              elif any(x in location for x in priority_2):
                  score += 10
                  reasons.append("Preferred location")
              elif (
                  "remote" in location
                  and "remote india" in [
                      x.lower()
                      for x in profile["locations"].get(
                          "priority_3", []
                      )
                  ]
              ):
                  score += 7
                  reasons.append("Remote option")

              # -----------------------------
              # 6. Avoid / low-priority roles
              # -----------------------------
              matched_avoid = [
                  term for term in avoid
                  if term in title_lower
              ]

              if matched_avoid:
                  score -= 25
                  reasons.append(
                      "Possible role mismatch: "
                      + ", ".join(matched_avoid[:3])
                  )

              # Don't let "AI" alone inflate a normal Java role.
              # It is already represented as a secondary skill.

              return (
                  max(0, min(round(score), 100)),
                  reasons
              )

          # -----------------------------
          # Rank all jobs
          # -----------------------------
          ranked = []

          for job in data.get("results", []):
              score, reasons = score_job(job)

              ranked.append({
                  "score": score,
                  "title": job.get("title", ""),
                  "company": job.get("company", ""),
                  "location": job.get("location", ""),
                  "date": job.get("date", ""),
                  "url": job.get("url", ""),
                  "job_id": job.get("id", ""),
                  "reasons": reasons
              })

          ranked.sort(
              key=lambda x: x["score"],
              reverse=True
          )

          # -----------------------------
          # Report
          # -----------------------------
          report = [
              f"# Daily Job Report — {date.today()}",
              "",
              f"**Jobs found:** {len(ranked)}",
              "",
              "## 🔥 Top Matches",
              ""
          ]

          for i, job in enumerate(
              ranked[:20],
              1
          ):
              report.extend([
                  f"### {i}. {job['title']}",
                  (
                      f"**{job['company']}** — "
                      f"{job['location']}"
                  ),
                  (
                      f"**Match score: "
                      f"{job['score']}/100**"
                  ),
                  "",
                  "**Why:** "
                  + (
                      "; ".join(job["reasons"])
                      if job["reasons"]
                      else "Limited information available"
                  ),
                  "",
                  f"**Apply:** {job['url']}",
                  ""
              ])

          Path("jobs/daily-report.md").write_text(
              "\n".join(report)
          )

          Path("jobs/ranked.json").write_text(
              json.dumps(ranked, indent=2)
          )

          print("\n".join(report))
          PY

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-results
          path: jobs/
          retention-days: 30
