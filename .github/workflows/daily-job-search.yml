name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search Pune
        run: |
          echo "===== PUNE ====="
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Pune, Maharashtra, India" \
            --jobage 7 \
            --limit 5 \
            --format json > jobs/pune.json

      - name: Search Gurugram
        run: |
          echo "===== GURUGRAM ====="
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Gurugram, Haryana, India" \
            --jobage 7 \
            --limit 5 \
            --format json > jobs/gurugram.json

      - name: Search Noida
        run: |
          echo "===== NOIDA ====="
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Noida, Uttar Pradesh, India" \
            --jobage 7 \
            --limit 5 \
            --format json > jobs/noida.json

      - name: Search Bengaluru
        run: |
          echo "===== BENGALURU ====="
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Bengaluru, Karnataka, India" \
            --jobage 7 \
            --limit 5 \
            --format json > jobs/bengaluru.json

      - name: Search Hyderabad
        run: |
          echo "===== HYDERABAD ====="
          bun run .agents/skills/linkedin-search/cli/src/cli.ts search \
            --query "Java Spring Boot" \
            --location "Hyderabad, Telangana, India" \
            --jobage 7 \
            --limit 5 \
            --format json > jobs/hyderabad.json

      - name: Combine results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []

          for file in Path("jobs").glob("*.json"):
              if file.name == "all.json":
                  continue

              try:
                  data = json.loads(file.read_text())
                  if isinstance(data, list):
                      jobs.extend(data)
                  elif isinstance(data, dict):
                      jobs.append(data)
              except Exception as e:
                  print(f"Could not read {file}: {e}")

          # Deduplicate by job ID
          unique = {}
          for job in jobs:
              job_id = str(job.get("id", job.get("job_id", "")))
              if job_id:
                  unique[job_id] = job

          Path("jobs/all.json").write_text(
              json.dumps(list(unique.values()), indent=2)
          )

          print(f"Total unique jobs: {len(unique)}")
          PY

      - name: Upload job results
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-results
          path: jobs/
          retention-days: 30
