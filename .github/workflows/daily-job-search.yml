name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Search jobs
        shell: bash
        run: |
          set -e

          mkdir -p jobs/raw

          queries=(
            "Java Backend Developer"
            "Java Developer Spring Boot"
            "Java Microservices"
            "Spring Boot Backend"
            "Java Software Engineer"
          )

          locations=(
            "Pune"
            "Gurugram"
            "Noida"
            "Bengaluru"
            "Hyderabad"
            "Remote India"
          )

          for query in "${queries[@]}"; do
            for location in "${locations[@]}"; do
              echo "Searching: $query | $location"

              bun run src/cli.ts search \
                --query "$query" \
                --location "$location" \
                --jobage 7 \
                --limit 8 \
                --json > "jobs/raw/$(echo "$query-$location" | tr ' /' '__').json" || true

              sleep 1
            done
          done

      - name: Combine and deduplicate jobs
        shell: bash
        run: |
          set -e

          bun run src/cli.ts combine \
            --input jobs/raw \
            --output jobs/combined.json

      - name: Fetch job details
        shell: bash
        run: |
          set -e

          mkdir -p jobs/details

          node - <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const jobs = JSON.parse(
            fs.readFileSync("jobs/combined.json", "utf8")
          );

          for (const job of jobs) {
            const id = String(job.id);

            console.log(`Fetching details for ${id}`);

            try {
              const result = execFileSync(
                "bun",
                [
                  "run",
                  "src/cli.ts",
                  "detail",
                  "--id",
                  id,
                  "--json"
                ],
                {
                  encoding: "utf8",
                  timeout: 30000
                }
              );

              fs.writeFileSync(
                `jobs/details/${id}.json`,
                result
              );
            } catch (error) {
              console.log(`Failed to fetch ${id}`);
            }

            execFileSync("sleep", ["1"]);
          }
          NODE

      - name: Rank jobs
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require("fs");

          const profile = JSON.parse(
            fs.readFileSync("config/job-profile.json", "utf8")
          );

          const jobsDir = "jobs/details";

          const jobs = fs
            .readdirSync(jobsDir)
            .filter(file => file.endsWith(".json"))
            .map(file => {
              try {
                return JSON.parse(
                  fs.readFileSync(`${jobsDir}/${file}`, "utf8")
                );
              } catch {
                return null;
              }
            })
            .filter(Boolean);

          const normalize = value =>
            String(value || "")
              .toLowerCase()
              .replace(/[^\w+#.]+/g, " ")
              .replace(/\s+/g, " ")
              .trim();

          const textOf = job =>
            normalize([
              job.title,
              job.description,
              job.location,
              job.company
            ].join(" "));

          const titleOf = job =>
            normalize(job.title);

          function containsTerm(text, term) {
            const normalizedTerm = normalize(term);

            if (!normalizedTerm) return false;

            return text.includes(normalizedTerm);
          }

          function extractExperienceRange(job) {
            const text = [
              job.title || "",
              job.description || "",
              job.requirements || "",
              job.experience || ""
            ].join(" ");

            const patterns = [
              /(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)\s*(?:years?|yrs?)/i,
              /(\d+(?:\.\d+)?)\s*(?:to)\s*(\d+(?:\.\d+)?)\s*(?:years?|yrs?)/i,
              /(\d+(?:\.\d+)?)\s*\+\s*(?:years?|yrs?)/i
            ];

            for (const pattern of patterns) {
              const match = text.match(pattern);

              if (!match) continue;

              const minimum = Number(match[1]);

              if (match[2] !== undefined) {
                return {
                  minimum,
                  maximum: Number(match[2]),
                  openEnded: false
                };
              }

              return {
                minimum,
                maximum: Infinity,
                openEnded: true
              };
            }

            return null;
          }

          function experienceScore(job) {
            const range = extractExperienceRange(job);

            if (!range) {
              return {
                score: 0,
                penalty: 0,
                label: "Experience: not stated"
              };
            }

            const {
              current_years,
              minimum_years,
              ideal_minimum_years,
              ideal_maximum_years,
              maximum_years
            } = profile.experience;

            const minimum = range.minimum;
            const maximum = range.maximum;

            /*
             * Open-ended requirements such as "1+ years" need
             * different treatment from "3+ years".
             *
             * For a 3-year candidate:
             *   3+  -> ideal
             *   2+  -> strong
             *   1+  -> below target
             *   4+  -> slight stretch
             *   5+  -> stretch
             */

            if (range.openEnded) {
              if (minimum > maximum_years) {
                return {
                  score: 0,
                  penalty: -20,
                  label: `Experience: ${minimum:g}+ years (mismatch)`
                };
              }

              if (minimum > current_years) {
                const gap = minimum - current_years;

                if (gap >= 2) {
                  return {
                    score: 4,
                    penalty: -10,
                    label: `Experience: ${minimum:g}+ years (significant stretch)`
                  };
                }

                return {
                  score: 6,
                  penalty: -5,
                  label: `Experience: ${minimum:g}+ years (slight stretch)`
                };
              }

              if (minimum >= ideal_minimum_years) {
                return {
                  score: 10,
                  penalty: 0,
                  label: `Experience: ${minimum:g}+ years (ideal fit)`
                };
              }

              /*
               * 1+ and 2+ are below the candidate's ideal level.
               * They are not mismatches, but should not be rewarded
               * like an ideal 3+ role.
               */
              return {
                score: 5,
                penalty: 0,
                label: `Experience: ${minimum:g}+ years (below target)`
              };
            }

            /*
             * Bounded ranges.
             *
             * Check the upper bound FIRST so something like 4–12
             * cannot incorrectly become "slight stretch" merely
             * because its minimum is above the candidate's current
             * experience.
             */

            const excess = maximum - maximum_years;

            if (excess >= 4) {
              return {
                score: 0,
                penalty: -20,
                label: `Experience: ${minimum:g}–${maximum:g} years (mismatch)`
              };
            }

            if (excess >= 2) {
              return {
                score: 4,
                penalty: -10,
                label: `Experience: ${minimum:g}–${maximum:g} years (significant stretch)`
              };
            }

            if (excess > 0) {
              return {
                score: 6,
                penalty: -5,
                label: `Experience: ${minimum:g}–${maximum:g} years (slight stretch)`
              };
            }

            if (
              minimum >= ideal_minimum_years &&
              maximum <= ideal_maximum_years
            ) {
              return {
                score: 10,
                penalty: 0,
                label: `Experience: ${minimum:g}–${maximum:g} years (ideal fit)`
              };
            }

            if (
              minimum >= minimum_years &&
              maximum <= maximum_years
            ) {
              return {
                score: 8,
                penalty: 0,
                label: `Experience: ${minimum:g}–${maximum:g} years (acceptable fit)`
              };
            }

            if (minimum > current_years) {
              const gap = minimum - current_years;

              if (gap >= 2) {
                return {
                  score: 4,
                  penalty: -10,
                  label: `Experience: ${minimum:g}–${maximum:g} years (significant stretch)`
                };
              }

              return {
                score: 6,
                penalty: -5,
                label: `Experience: ${minimum:g}–${maximum:g} years (slight stretch)`
              };
            }

            if (maximum < minimum_years) {
              return {
                score: 5,
                penalty: 0,
                label: `Experience: ${minimum:g}–${maximum:g} years (below target)`
              };
            }

            return {
              score: 7,
              penalty: 0,
              label: `Experience: ${minimum:g}–${maximum:g} years (strong fit)`
            };
          }

          function roleScore(job) {
            const title = titleOf(job);

            for (const role of profile.target_roles.primary) {
              if (containsTerm(title, role)) {
                return {
                  score: 20,
                  label: "Primary role"
                };
              }
            }

            for (const role of profile.target_roles.secondary) {
              if (containsTerm(title, role)) {
                return {
                  score: 12,
                  label: "Secondary role"
                };
              }
            }

            const backendTerms = [
              "backend",
              "java",
              "software engineer",
              "software development engineer",
              "application developer",
              "platform engineer"
            ];

            if (backendTerms.some(term => containsTerm(title, term))) {
              return {
                score: 8,
                label: "Relevant backend role"
              };
            }

            return {
              score: 0,
              label: ""
            };
          }

          function skillScore(job) {
            const text = textOf(job);

            let highValueMatches = profile.skills.high_value
              .filter(skill => containsTerm(text, skill));

            let supportingMatches = profile.skills.supporting
              .filter(skill => containsTerm(text, skill));

            let bonusMatches = profile.skills.bonus
              .filter(skill => containsTerm(text, skill));

            return {
              highValueMatches,
              supportingMatches,
              bonusMatches,

              score:
                Math.min(highValueMatches.length * 4, 20) +
                Math.min(supportingMatches.length * 1.5, 10) +
                Math.min(bonusMatches.length, 5)
            };
          }

          function locationScore(job) {
            const text = textOf(job);

            let best = null;

            for (const [location, weight] of Object.entries(
              profile.locations
            )) {
              if (containsTerm(text, location)) {
                if (!best || weight > best.weight) {
                  best = {
                    location,
                    weight
                  };
                }
              }
            }

            if (!best) {
              return {
                score: 0,
                label: "Location: not prioritized"
              };
            }

            return {
              score: Math.min(best.weight / 33.33, 3),
              label: `Location: ${best.location}`
            };
          }

          function avoidScore(job) {
            const title = titleOf(job);

            const match = profile.avoid.find(term =>
              containsTerm(title, term)
            );

            if (!match) {
              return {
                score: 0,
                label: ""
              };
            }

            return {
              score: -30,
              label: `Avoid: ${match}`
            };
          }

          function calculateScore(job) {
            const text = textOf(job);

            const mustHaveMatches = profile.skills.must_have
              .filter(skill => containsTerm(text, skill));

            if (mustHaveMatches.length === 0) {
              return null;
            }

            const role = roleScore(job);
            const skills = skillScore(job);
            const experience = experienceScore(job);
            const location = locationScore(job);
            const avoid = avoidScore(job);

            let score = 0;

            score += mustHaveMatches.length * 20;
            score += role.score;
            score += skills.score;
            score += experience.score;
            score += experience.penalty;
            score += location.score;
            score += avoid.score;

            score = Math.max(0, Math.min(100, Math.round(score)));

            const why = [
              `Must-have: ${mustHaveMatches.join(", ")}`,
              role.label,
              skills.highValueMatches.length
                ? `High-value skills: ${skills.highValueMatches.join(", ")}`
                : "",
              skills.supportingMatches.length
                ? `Supporting skills: ${skills.supportingMatches.join(", ")}`
                : "",
              skills.bonusMatches.length
                ? `Bonus skills: ${skills.bonusMatches.join(", ")}`
                : "",
              experience.label,
              location.label,
              avoid.label
            ].filter(Boolean);

            return {
              ...job,
              score,
              why: why.join("; ")
            };
          }

          const ranked = jobs
            .map(calculateScore)
            .filter(Boolean)
            .sort((a, b) => b.score - a.score)
            .slice(0, profile.daily_target);

          fs.writeFileSync(
            "jobs/ranked.json",
            JSON.stringify(ranked, null, 2)
          );

          let report = `# Daily Job Report — ${new Date()
            .toISOString()
            .slice(0, 10)}\n\n`;

          report += `**Jobs found:** ${jobs.length}\n\n`;

          report += `## 🔥 Top Matches\n\n`;

          ranked.forEach((job, index) => {
            report += `### ${index + 1}. ${job.title || "Untitled"}\n`;
            report += `**${job.company || "Unknown company"}** — ${
              job.location || "Location not stated"
            }\n`;
            report += `**Match score: ${job.score}/100**\n\n`;
            report += `**Why:** ${job.why}\n\n`;
            report += `**Apply:** ${job.url || job.apply_url || ""}\n\n`;
          });

          fs.writeFileSync(
            "jobs/daily-report.md",
            report
          );

          console.log(`Ranked ${ranked.length} jobs.`);
          NODE

      - name: Upload daily report
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-report-${{ github.run_number }}
          path: jobs/
          retention-days: 30

      - name: Print top jobs
        shell: bash
        run: |
          echo "========================================"
          echo "TOP JOBS"
          echo "========================================"
          cat jobs/daily-report.md
