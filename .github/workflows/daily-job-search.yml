name: Daily Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  search-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create jobs directory
        run: mkdir -p jobs

      - name: Search jobs across locations and queries
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          cli = ".agents/skills/linkedin-search/cli/src/cli.ts"

          queries = [
              "Java Backend Developer",
              "Java Developer Spring Boot",
              "Java Microservices",
              "Spring Boot Backend",
              "Java Software Engineer",
          ]

          locations = [
              ("pune", "Pune, Maharashtra, India"),
              ("gurugram", "Gurugram, Haryana, India"),
              ("noida", "Noida, Uttar Pradesh, India"),
              ("bengaluru", "Bengaluru, Karnataka, India"),
              ("hyderabad", "Hyderabad, Telangana, India"),
              ("remote", "Remote India"),
          ]

          total = 0

          for location_key, location in locations:
              for query_index, query in enumerate(queries, 1):
                  output_file = Path(
                      f"jobs/search-{location_key}-{query_index}.json"
                  )

                  print(f"Searching: {query} | {location}")

                  try:
                      result = subprocess.run(
                          [
                              "bun",
                              "run",
                              cli,
                              "search",
                              "--query",
                              query,
                              "--location",
                              location,
                              "--jobage",
                              "1",
                              "--limit",
                              "8",
                              "--format",
                              "json",
                          ],
                          capture_output=True,
                          text=True,
                          timeout=60,
                      )

                      if result.returncode == 0:
                          output_file.write_text(result.stdout)
                          total += 1
                      else:
                          print(
                              f"Search failed for {query} | {location}: "
                              f"{result.stderr[:500]}"
                          )

                  except Exception as exc:
                      print(
                          f"Search error for {query} | {location}: {exc}"
                      )

          print(f"Successful searches: {total}/30")
          PY

      - name: Combine and deduplicate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = []
          seen = set()

          for file in Path("jobs").glob("search-*.json"):
              try:
                  data = json.loads(file.read_text())
              except Exception as exc:
                  print(f"Skipping invalid {file}: {exc}")
                  continue

              for job in data.get("results", []):
                  job_id = job.get("id")

                  if job_id and job_id not in seen:
                      seen.add(job_id)
                      jobs.append(job)

          output = {
              "count": len(jobs),
              "results": jobs,
          }

          Path("jobs/all.json").write_text(
              json.dumps(output, indent=2)
          )

          print(f"Unique jobs collected: {len(jobs)}")
          PY

      - name: Fetch job details
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          cli = ".agents/skills/linkedin-search/cli/src/cli.ts"

          data = json.loads(
              Path("jobs/all.json").read_text()
          )

          detailed = []
          results = data.get("results", [])

          for i, job in enumerate(results, 1):
              job_id = job["id"]

              print(
                  f"[{i}/{len(results)}] "
                  f"Fetching {job_id} - {job.get('title', '')}"
              )

              try:
                  result = subprocess.run(
                      [
                          "bun",
                          "run",
                          cli,
                          "detail",
                          job_id,
                          "--format",
                          "json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )

                  if result.returncode == 0:
                      detail = json.loads(result.stdout)

                      if isinstance(detail, dict):
                          job.update(detail)

                  else:
                      print(
                          f"Detail fetch failed for {job_id}: "
                          f"{result.stderr[:300]}"
                      )

                  detailed.append(job)

              except Exception as exc:
                  print(
                      f"Error fetching {job_id}: {exc}"
                  )
                  detailed.append(job)

              time.sleep(1)

          Path("jobs/detailed.json").write_text(
              json.dumps(
                  {
                      "count": len(detailed),
                      "results": detailed,
                  },
                  indent=2,
              )
          )

          print(
              f"Detailed jobs collected: {len(detailed)}"
          )
          PY

      - name: Create ranked report
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import date
          from pathlib import Path

          profile = json.loads(
              Path("config/job-profile.json").read_text()
          )

          data = json.loads(
              Path("jobs/detailed.json").read_text()
          )

          target_roles = profile.get(
              "target_roles",
              {}
          )

          primary_roles = [
              x.lower()
              for x in target_roles.get("primary", [])
          ]

          secondary_roles = [
              x.lower()
              for x in target_roles.get("secondary", [])
          ]

          experience = profile.get(
              "experience",
              {}
          )

          current_years = float(
              experience.get("current_years", 0)
          )

          minimum_years = float(
              experience.get("minimum_years", 0)
          )

          ideal_minimum_years = float(
              experience.get("ideal_minimum_years", 0)
          )

          ideal_maximum_years = float(
              experience.get("ideal_maximum_years", 0)
          )

          maximum_years = float(
              experience.get("maximum_years", 0)
          )

          skills = profile.get(
              "skills",
              {}
          )

          must_have = [
              x.lower()
              for x in skills.get("must_have", [])
          ]

          high_value = [
              x.lower()
              for x in skills.get("high_value", [])
          ]

          supporting = [
              x.lower()
              for x in skills.get("supporting", [])
          ]

          bonus = [
              x.lower()
              for x in skills.get("bonus", [])
          ]

          locations = {
              k.lower(): float(v)
              for k, v in profile.get(
                  "locations",
                  {}
              ).items()
          }

          avoid = [
              x.lower()
              for x in profile.get("avoid", [])
          ]

          daily_target = int(
              profile.get("daily_target", 50)
          )

          def normalize(value):
              return re.sub(
                  r"\s+",
                  " ",
                  str(value or "").lower()
              ).strip()

          def job_text(job):
              return " ".join(
                  [
                      str(job.get("title", "")),
                      str(job.get("description", "")),
                      str(job.get("requirements", "")),
                      str(job.get("experience", "")),
                  ]
              )

          def extract_experience_range(text):
              patterns = [
                  (
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:-|–|—|to)\s*"
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:\+)?\s*(?:years?|yrs?)"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*\+\s*"
                      r"(?:years?|yrs?)"
                  ),
                  (
                      r"(\d+(?:\.\d+)?)\s*"
                      r"(?:years?|yrs?)"
                  ),
              ]

              ranges = []

              for pattern in patterns:
                  for match in re.finditer(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  ):
                      if match.lastindex == 2:
                          low = float(match.group(1))
                          high = float(match.group(2))

                          ranges.append(
                              (low, high, False)
                          )
                      else:
                          low = float(match.group(1))

                          if "+" in match.group(0):
                              ranges.append(
                                  (low, None, True)
                              )
                          else:
                              ranges.append(
                                  (low, low, False)
                              )

              if not ranges:
                  return None

              return ranges[0]

          def experience_score(text):
              result = extract_experience_range(text)

              if result is None:
                  return (
                      0,
                      0,
                      "Experience: not stated"
                  )

              minimum, maximum, open_ended = result

              if open_ended:

                  if minimum > maximum_years:
                      return (
                          0,
                          -20,
                          f"Experience: {minimum:g}+ years "
                          "(mismatch)"
                      )

                  if minimum > current_years:
                      gap = minimum - current_years

                      if gap >= 2:
                          return (
                              4,
                              -10,
                              f"Experience: {minimum:g}+ years "
                              "(significant stretch)"
                          )

                      return (
                          6,
                          -5,
                          f"Experience: {minimum:g}+ years "
                          "(slight stretch)"
                      )

                  if minimum >= ideal_minimum_years:
                      return (
                          10,
                          0,
                          f"Experience: {minimum:g}+ years "
                          "(ideal fit)"
                      )

                  return (
                      5,
                      0,
                      f"Experience: {minimum:g}+ years "
                      "(below target)"
                  )

              excess = maximum - maximum_years

              if excess >= 4:
                  return (
                      0,
                      -20,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(mismatch)"
                  )

              if excess >= 2:
                  return (
                      4,
                      -10,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(significant stretch)"
                  )

              if excess > 0:
                  return (
                      6,
                      -5,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(slight stretch)"
                  )

              if maximum < ideal_minimum_years:
                  return (
                      5,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(below target)"
                  )

              if (
                  minimum >= ideal_minimum_years
                  and maximum <= ideal_maximum_years
              ):
                  return (
                      10,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(ideal fit)"
                  )

              if (
                  minimum >= minimum_years
                  and maximum <= maximum_years
              ):
                  return (
                      8,
                      0,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(acceptable fit)"
                  )

              if minimum > current_years:
                  gap = minimum - current_years

                  if gap >= 2:
                      return (
                          4,
                          -10,
                          f"Experience: {minimum:g}–{maximum:g} years "
                          "(significant stretch)"
                      )

                  return (
                      6,
                      -5,
                      f"Experience: {minimum:g}–{maximum:g} years "
                      "(slight stretch)"
                  )

              return (
                  7,
                  0,
                  f"Experience: {minimum:g}–{maximum:g} years "
                  "(strong fit)"
              )

          def role_score(title):
              title = normalize(title)

              for role in primary_roles:
                  if role in title:
                      return (
                          20,
                          "Primary role"
                      )

              for role in secondary_roles:
                  if role in title:
                      return (
                          12,
                          "Secondary role"
                      )

              backend_terms = [
                  "backend",
                  "back end",
                  "java developer",
                  "java engineer",
                  "software engineer",
                  "software development engineer",
                  "application developer",
                  "platform engineer",
              ]

              if any(
                  term in title
                  for term in backend_terms
              ):
                  return (
                      8,
                      "Relevant backend role"
                  )

              return (
                  0,
                  ""
              )

          def skill_score(text):
              text = normalize(text)

              high_matches = [
                  skill
                  for skill in high_value
                  if skill in text
              ]

              supporting_matches = [
                  skill
                  for skill in supporting
                  if skill in text
              ]

              bonus_matches = [
                  skill
                  for skill in bonus
                  if skill in text
              ]

              score = (
                  min(
                      len(high_matches) * 4,
                      20
                  )
                  +
                  min(
                      len(supporting_matches) * 1.5,
                      10
                  )
                  +
                  min(
                      len(bonus_matches),
                      5
                  )
              )

              return (
                  score,
                  high_matches,
                  supporting_matches,
                  bonus_matches,
              )

          def location_score(location):
              location = normalize(location)

              best_location = None
              best_weight = 0

              for name, weight in locations.items():
                  if name in location:
                      if weight > best_weight:
                          best_location = name
                          best_weight = weight

              if best_location is None:
                  return (
                      0,
                      "Location: not prioritized"
                  )

              return (
                  min(
                      best_weight / 33.33,
                      3
                  ),
                  f"Location: {best_location.title()}"
              )

          def avoid_score(title):
              title = normalize(title)

              matches = [
                  term
                  for term in avoid
                  if term in title
              ]

              if not matches:
                  return (
                      0,
                      ""
                  )

              return (
                  -30,
                  "Avoid: " + ", ".join(matches[:3])
              )

          def score_job(job):
              title = job.get("title", "")
              location = job.get("location", "")

              text = job_text(job)

              must_matches = [
                  skill
                  for skill in must_have
                  if skill in normalize(text)
              ]

              if not must_matches:
                  return None

              score = 0
              reasons = []

              score += len(must_matches) * 20

              reasons.append(
                  "Must-have: "
                  + ", ".join(must_matches)
              )

              role_points, role_reason = role_score(
                  title
              )

              score += role_points

              if role_reason:
                  reasons.append(role_reason)

              (
                  skill_points,
                  high_matches,
                  supporting_matches,
                  bonus_matches,
              ) = skill_score(text)

              score += skill_points

              if high_matches:
                  reasons.append(
                      "High-value skills: "
                      + ", ".join(high_matches)
                  )

              if supporting_matches:
                  reasons.append(
                      "Supporting skills: "
                      + ", ".join(supporting_matches)
                  )

              if bonus_matches:
                  reasons.append(
                      "Bonus skills: "
                      + ", ".join(bonus_matches)
                  )

              (
                  experience_points,
                  experience_penalty,
                  experience_reason,
              ) = experience_score(text)

              score += experience_points
              score += experience_penalty

              reasons.append(
                  experience_reason
              )

              (
                  location_points,
                  location_reason,
              ) = location_score(location)

              score += location_points

              reasons.append(
                  location_reason
              )

              (
                  avoid_points,
                  avoid_reason,
              ) = avoid_score(title)

              score += avoid_points

              if avoid_reason:
                  reasons.append(
                      avoid_reason
                  )

              score = max(
                  0,
                  min(
                      round(score),
                      100
                  )
              )

              return {
                  "score": score,
                  "title": title,
                  "company": job.get(
                      "company",
                      ""
                  ),
                  "location": location,
                  "date": job.get(
                      "date",
                      ""
                  ),
                  "url": job.get(
                      "url",
                      ""
                  ),
                  "job_id": job.get(
                      "id",
                      ""
                  ),
                  "reasons": reasons,
              }

          ranked = []

          for job in data.get(
              "results",
              []
          ):
              scored = score_job(job)

              if scored:
                  ranked.append(scored)

          ranked.sort(
              key=lambda x: x["score"],
              reverse=True,
          )

          top_jobs = ranked[
              :daily_target
          ]

          report = [
              f"# Daily Job Report — {date.today()}",
              "",
              f"**Jobs found:** {len(ranked)}",
              "",
              "## 🔥 Top Matches",
              "",
          ]

          for i, job in enumerate(
              top_jobs,
              1
          ):
              report.extend(
                  [
                      f"### {i}. {job['title']}",
                      (
                          f"**{job['company']}** — "
                          f"{job['location']}"
                      ),
                      (
                          f"**Match score: "
                          f"{job['score']}/100**"
                      ),
                      "",
                      "**Why:** "
                      + "; ".join(
                          job["reasons"]
                      ),
                      "",
                      f"**Apply:** {job['url']}",
                      "",
                  ]
              )

          Path(
              "jobs/daily-report.md"
          ).write_text(
              "\n".join(report)
          )

          Path(
              "jobs/ranked.json"
          ).write_text(
              json.dumps(
                  ranked,
                  indent=2
              )
          )

          print(
              "\n".join(report)
          )
          PY

      - name: Tailor top 70 jobs with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent"
          TARGET_JOBS = 70
          MINIMUM_JOBS = 60
          MAX_RETRIES = 6
          SUCCESS_DELAY_SECONDS = 4

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              raise RuntimeError("GEMINI_API_KEY GitHub secret is not configured.")

          ranked = json.loads(Path("jobs/ranked.json").read_text())
          detailed = json.loads(Path("jobs/detailed.json").read_text())
          master_resume = Path("resume/master_resume.tex").read_text()
          candidate_skills = json.loads(Path("config/candidate-skills.json").read_text())

          if len(ranked) < MINIMUM_JOBS:
              raise RuntimeError(
                  f"Only {len(ranked)} ranked jobs are available; at least {MINIMUM_JOBS} are required."
              )

          selected = ranked[:TARGET_JOBS]
          detailed_by_id = {
              str(job.get("id")): job
              for job in detailed.get("results", [])
          }

          output_dir = Path("jobs/tailored-resumes")
          output_dir.mkdir(parents=True, exist_ok=True)

          def extract_text(api_response):
              try:
                  return api_response["candidates"][0]["content"]["parts"][0]["text"]
              except (KeyError, IndexError, TypeError) as exc:
                  raise RuntimeError(
                      "Gemini response did not contain generated text."
                  ) from exc

          def call_gemini(prompt):
              payload = {
                  "contents": [{
                      "role": "user",
                      "parts": [{"text": prompt}],
                  }],
                  "generationConfig": {
                      "responseMimeType": "application/json"
                  },
              }

              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "x-goog-api-key": api_key,
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )

              for attempt in range(1, MAX_RETRIES + 1):
                  try:
                      with urllib.request.urlopen(request, timeout=180) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", errors="replace")
                      retryable = exc.code in {429, 500, 502, 503, 504}
                      if not retryable or attempt == MAX_RETRIES:
                          print(f"Gemini HTTP {exc.code}: {body[:1000]}")
                          raise

                      retry_after = exc.headers.get("Retry-After")
                      if retry_after:
                          try:
                              delay = max(float(retry_after), 1.0)
                          except ValueError:
                              delay = min(90, 10 * (2 ** (attempt - 1)))
                      else:
                          delay = min(90, 10 * (2 ** (attempt - 1)))

                      print(
                          f"Gemini HTTP {exc.code}; retry {attempt}/{MAX_RETRIES} "
                          f"after {delay:g}s"
                      )
                      time.sleep(delay)
                  except urllib.error.URLError as exc:
                      if attempt == MAX_RETRIES:
                          raise
                      delay = min(90, 10 * (2 ** (attempt - 1)))
                      print(
                          f"Gemini network error; retry {attempt}/{MAX_RETRIES} "
                          f"after {delay:g}s: {exc}"
                      )
                      time.sleep(delay)

              raise RuntimeError("Gemini request failed after retries.")

          def safe_filename(value):
              return re.sub(r"[^A-Za-z0-9._-]+", "-", str(value)).strip("-")

          results = []
          failures = []

          for index, ranked_job in enumerate(selected, 1):
              job_id = str(ranked_job.get("job_id", "")).strip()
              if not job_id:
                  failures.append({"rank": index, "reason": "Missing job_id"})
                  continue

              job = detailed_by_id.get(job_id)
              if not job:
                  failures.append({
                      "rank": index,
                      "job_id": job_id,
                      "reason": "Job not found in detailed.json",
                  })
                  continue

              job_key = hashlib.sha256(job_id.encode("utf-8")).hexdigest()[:12]
              job_description = str(job.get("description", "")).strip()

              if not job_description:
                  failures.append({
                      "rank": index,
                      "job_id": job_id,
                      "job_key": job_key,
                      "reason": "No full job description",
                  })
                  continue

              print(
                  f"\\n[{index}/{len(selected)}] "
                  f"Tailoring {ranked_job.get('title', '')} | "
                  f"{ranked_job.get('company', '')} | ID {job_id} | KEY {job_key}"
              )

              prompt = f"""
          You are a precise resume tailoring engine.

          Produce BOTH a tailoring analysis and the complete final LaTeX resume in ONE response.

          STRICT FACTUAL RULES:
          1. The MASTER RESUME is the source of truth for all professional experience,
             projects, achievements, metrics, employers, dates, education, contact
             information, and factual claims.
          2. CANDIDATE SKILLS is a source of truth for skills the candidate genuinely knows.
             Skills from working_knowledge or familiar may be listed as skills when relevant,
             but must never become fabricated experience or project claims.
          3. Never invent experience, projects, technologies used in a project,
             responsibilities, achievements, metrics, employers, dates, certifications,
             degrees, or years of experience.
          4. Rewrites must preserve the factual meaning of existing master-resume bullets.
          5. Do not remove factual information merely because it is not in the job description.
          6. Do not add a new resume section.
          7. Preserve the master's one-page structure and overall visual style.
          8. Tailor wording, bullet ordering, profile emphasis, and skill ordering only when
             supported by the master resume, candidate skills, and job description.
          9. A job-description technology may only appear in the resume if supported by the
             MASTER RESUME or CANDIDATE SKILLS. If it is only in CANDIDATE SKILLS, it may be
             listed as a skill but must not be used to fabricate experience.
          10. The job identity supplied below is CANONICAL. Do not invent or alter it.

          Return ONLY valid JSON with exactly these fields:
          {{
            "required_skills": [],
            "matched_skills": [],
            "missing_skills": [],
            "most_relevant_experience_bullets": [],
            "most_relevant_projects": [],
            "recommended_skill_order": [],
            "recommended_profile_focus": [],
            "recommended_bullet_rewrites": [],
            "tailoring_notes": [],
            "tex": "complete LaTeX source"
          }}

          For recommended_bullet_rewrites, reference an existing bullet and provide a rewrite
          that preserves its factual meaning. Do not introduce unsupported claims.

          CANONICAL JOB:
          ----------------
          ID: {job_id}
          Job Key: {job_key}
          Title: {ranked_job.get('title', '')}
          Company: {ranked_job.get('company', '')}
          Location: {ranked_job.get('location', '')}
          URL: {ranked_job.get('url', '')}
          Match Score: {ranked_job.get('score', '')}/100
          ----------------

          MASTER RESUME:
          ----------------
          {master_resume}
          ----------------

          CANDIDATE SKILLS:
          ----------------
          {json.dumps(candidate_skills, indent=2, ensure_ascii=False)}
          ----------------

          JOB DESCRIPTION:
          ----------------
          {job_description}
          ----------------

          The generated LaTeX must start with \\documentclass and compile with pdflatex.
          """

              try:
                  api_response = call_gemini(prompt)
                  output_text = extract_text(api_response)
                  result = json.loads(output_text)
                  tailored_tex = result.get("tex")

                  if not isinstance(tailored_tex, str) or not tailored_tex.strip().startswith("\\documentclass"):
                      raise RuntimeError("Gemini returned invalid LaTeX.")

                  tex_path = output_dir / f"{job_key}.tex"
                  tailoring_path = output_dir / f"{job_key}.json"
                  tex_path.write_text(tailored_tex)

                  # Gemini is never authoritative for identity.
                  tailoring_record = {
                      "job": {
                          "id": job_id,
                          "job_key": job_key,
                          "title": ranked_job.get("title", ""),
                          "company": ranked_job.get("company", ""),
                          "location": ranked_job.get("location", ""),
                          "url": ranked_job.get("url", ""),
                      },
                      "rank": index,
                      "score": ranked_job.get("score", ""),
                      "required_skills": result.get("required_skills", []),
                      "matched_skills": result.get("matched_skills", []),
                      "missing_skills": result.get("missing_skills", []),
                      "most_relevant_experience_bullets": result.get("most_relevant_experience_bullets", []),
                      "most_relevant_projects": result.get("most_relevant_projects", []),
                      "recommended_skill_order": result.get("recommended_skill_order", []),
                      "recommended_profile_focus": result.get("recommended_profile_focus", []),
                      "recommended_bullet_rewrites": result.get("recommended_bullet_rewrites", []),
                      "tailoring_notes": result.get("tailoring_notes", []),
                  }
                  tailoring_path.write_text(json.dumps(tailoring_record, indent=2, ensure_ascii=False))

                  results.append({
                      "rank": index,
                      "job_key": job_key,
                      "job_id": job_id,
                      "title": ranked_job.get("title", ""),
                      "company": ranked_job.get("company", ""),
                      "location": ranked_job.get("location", ""),
                      "score": ranked_job.get("score", ""),
                      "url": ranked_job.get("url", ""),
                      "tex_path": str(tex_path),
                      "tailoring_path": str(tailoring_path),
                  })
                  print(f"SUCCESS: {job_key}")

              except Exception as exc:
                  failures.append({
                      "rank": index,
                      "job_id": job_id,
                      "job_key": job_key,
                      "title": ranked_job.get("title", ""),
                      "company": ranked_job.get("company", ""),
                      "reason": str(exc),
                  })
                  print(f"FAILED: {job_key}: {exc}")

              if index < len(selected):
                  time.sleep(SUCCESS_DELAY_SECONDS)

          Path("jobs/tailoring-results.json").write_text(
              json.dumps(
                  {
                      "requested": len(selected),
                      "successful": len(results),
                      "failed": len(failures),
                      "results": results,
                      "failures": failures,
                  },
                  indent=2,
                  ensure_ascii=False,
              )
          )

          print(
              f"\\nTailoring complete: {len(results)} successful, "
              f"{len(failures)} failed, {len(selected)} requested."
          )

          if len(results) < MINIMUM_JOBS:
              raise RuntimeError(
                  f"Only {len(results)} tailored resumes were generated; "
                  f"at least {MINIMUM_JOBS} are required."
              )
          PY

      - name: Compile tailored resumes
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra
          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          base = Path("jobs/tailored-resumes")
          data = json.loads(Path("jobs/tailoring-results.json").read_text())
          successful = []

          for item in data["results"]:
              job_key = item["job_key"]
              tex_path = Path(item["tex_path"])
              work_dir = base / f"build-{job_key}"
              work_dir.mkdir(parents=True, exist_ok=True)
              work_tex = work_dir / f"{job_key}.tex"
              shutil.copy2(tex_path, work_tex)

              print(f"Compiling {job_key}...")
              result = subprocess.run(
                  [
                      "pdflatex",
                      "-interaction=nonstopmode",
                      "-halt-on-error",
                      f"{job_key}.tex",
                  ],
                  cwd=work_dir,
                  capture_output=True,
                  text=True,
                  timeout=120,
              )

              if result.returncode != 0 or not (work_dir / f"{job_key}.pdf").is_file():
                  item["resume_status"] = "FAILED_COMPILE"
                  item["compile_error"] = result.stdout[-2000:]
                  print(f"FAILED COMPILE: {job_key}")
                  continue

              # A second pass is unnecessary for this one-page resume, and avoiding it
              # reduces runner time substantially across 60-70 documents.
              pdf_path = base / f"{job_key}.pdf"
              shutil.copy2(work_dir / f"{job_key}.pdf", pdf_path)

              # pdfinfo is provided by poppler-utils on ubuntu-latest.
              info = subprocess.run(
                  ["pdfinfo", str(pdf_path)],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              pages = None
              for line in info.stdout.splitlines():
                  if line.startswith("Pages:"):
                      pages = int(line.split(":", 1)[1].strip())
                      break

              item["resume_status"] = "SUCCESS"
              item["pdf_path"] = str(pdf_path)
              item["pages"] = pages
              successful.append(item)

              shutil.rmtree(work_dir, ignore_errors=True)
              tex_path.unlink(missing_ok=True)
              Path(item["tailoring_path"]).unlink(missing_ok=True)

          data["results"] = successful
          data["successful"] = len(successful)
          Path("jobs/tailoring-results.json").write_text(
              json.dumps(data, indent=2, ensure_ascii=False)
          )

          if len(successful) < 60:
              raise RuntimeError(
                  f"Only {len(successful)} PDFs compiled successfully; at least 60 are required."
              )

          print(f"Compiled PDFs: {len(successful)}")
          PY

      - name: Create Excel job tracker
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openpyxl import Workbook
          from openpyxl.styles import Font
          from openpyxl.utils import get_column_letter

          ranked = json.loads(Path("jobs/ranked.json").read_text())
          detailed = json.loads(Path("jobs/detailed.json").read_text())
          tailoring = json.loads(Path("jobs/tailoring-results.json").read_text())

          detailed_by_id = {
              str(job.get("id")): job
              for job in detailed.get("results", [])
          }
          tailoring_by_id = {
              str(item["job_id"]): item
              for item in tailoring.get("results", [])
          }

          wb = Workbook()
          ws = wb.active
          ws.title = "Job Tracker"

          headers = [
              "Rank", "Job Key", "Job ID", "Title", "Company", "Location",
              "Score", "Date", "Experience", "Matched Skills", "Missing Skills",
              "Why This Job", "Job URL", "Resume Status", "Pages", "Tailored Resume",
              "Full Job Description", "Requirements"
          ]
          ws.append(headers)

          for cell in ws[1]:
              cell.font = Font(bold=True)

          for rank, job in enumerate(ranked[:70], 1):
              job_id = str(job.get("job_id", ""))
              detail = detailed_by_id.get(job_id, {})
              result = tailoring_by_id.get(job_id, {})
              job_key = result.get("job_key", "")

              resume_file = (
                  f"tailored-resumes/{job_key}.pdf" if job_key else ""
              )

              ws.append([
                  rank,
                  job_key,
                  job_id,
                  job.get("title", ""),
                  job.get("company", ""),
                  job.get("location", ""),
                  job.get("score", ""),
                  job.get("date", detail.get("date", "")),
                  detail.get("experience", ""),
                  ", ".join(result.get("matched_skills", [])),
                  ", ".join(result.get("missing_skills", [])),
                  "; ".join(job.get("reasons", [])),
                  job.get("url", ""),
                  result.get("resume_status", ""),
                  result.get("pages", ""),
                  resume_file,
                  detail.get("description", ""),
                  detail.get("requirements", ""),
              ])

              row = ws.max_row
              if resume_file:
                  ws.cell(row=row, column=16).hyperlink = resume_file
                  ws.cell(row=row, column=16).font = Font(color="0000FF", underline="single")
